  var bar = "";
  if (tot > 0) {
    for (var i = 0; i < used.length; i++) {
      var v = catTotal(t, used[i].k);
      if (v <= 0) continue;
      bar += '<i style="width:' + (v / tot * 100) + '%;background:' + used[i].c + '"></i>';
    }
  }

  var meta = [];
  if (t.countries && t.countries.length) {
    var names = [];
    for (var q = 0; q < t.countries.length; q++) names.push(countryLabel(t.countries[q]));
    meta.push(esc(names.join(" · ")));
  }
  meta.push(esc(fmtRange(t.start, t.end)));

  var h = '<div class="trip">' +
    '<button class="trip-top" data-act="trip-open" data-v="' + esc(t.id) + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="row" style="align-items:flex-start">' +
        '<span class="grow"><span class="trip-name">' + esc(t.name || "Untitled trip") + "</span>" +
          '<span class="trip-meta">' + meta.join(" · ") + "</span></span>" +
        '<span style="text-align:right"><span class="trip-tot">' + money(tot) + "</span><br>" +
          '<span class="tag s-' + esc(t.status) + '">' + esc(t.status) + "</span></span>" +
      "</span>" +
      '<span class="trip-bar">' + bar + "</span>" +
    "</button>";

  if (open) {
    h += '<div class="trip-body">';
    if (!used.length) {
      h += '<p class="empty" style="margin:0">No expenses on this trip yet.</p>';
    }
    for (var c = 0; c < used.length; c++) {
      var cat = used[c], val = catTotal(t, cat.k);
      var pp = tot > 0 ? val / tot : 0;
      h += '<div class="brk"><span class="k">' + esc(cat.label) + "</span>" +
        '<span class="t"><i style="width:' + (pp * 100) + '%;background:' + cat.c + '"></i></span>' +
        '<span class="v">' + money(val) + "</span>" +
        '<span class="p">' + (tot > 0 ? Math.round(pp * 100) + "%" : "\u2014") + "</span></div>";

      /* the individual lines, unless a single anonymous expense already says
         everything the category row said */
      var lines = expensesInCat(t, cat.k);
      var mute = lines.length === 1 && !String(lines[0].label || "").trim() && !safeUrl(lines[0].url);
      if (mute) continue;
      for (var li = 0; li < lines.length; li++) {
        var e = lines[li];
        var url = safeUrl(e.url);
        var link = url
          ? '<a class="explink" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' +
            esc(linkHost(url)) + " \u2197</a>"
          : "";
        var name = String(e.label || "").trim();
        /* an unlabelled line is identified by its link; with neither, the
           amount is all there is to say */
        var who = name ? esc(name) + (link ? " " + link : "") : (link || "\u2014");
        h += '<div class="brk sub"><span class="sk">' + who + "</span>" +
          '<span class="sv">' + money(num(e.amount)) + "</span></div>";
      }
    }
    h += '<div class="brk" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px">' +
      '<span class="k" style="color:var(--ink);font-weight:600">Total</span><span class="t" style="background:transparent"></span>' +
      '<span class="v" style="font-weight:700;color:var(--ink)">' + money(tot) + '</span><span class="p"></span></div>';

    if (t.notes) h += '<div class="notes">' + esc(t.notes) + "</div>";

    h += '<div class="row" style="margin-top:11px">' +
      '<button class="btn small grow" data-act="trip-edit" data-v="' + esc(t.id) + '">Edit</button>' +
      '<button class="btn small danger" data-act="trip-del" data-v="' + esc(t.id) + '">Delete</button>' +
    "</div></div>";
  }

  return h + "</div>";
}

function renderTrips() {
  var h = "";
  var sorted = state.trips.slice().sort(function (a, b) { return tripTotal(b) - tripTotal(a); });

  var grand = 0;
  for (var g = 0; g < sorted.length; g++) grand += tripTotal(sorted[g]);

  h += '<div class="card"><div class="card-head"><span class="label">Trips \u00b7 ' + sorted.length +
       '</span><span class="trip-tot">' + money(grand) + "</span></div>" +
       '<button class="btn primary" style="width:100%" data-act="trip-new">＋ Add a trip</button></div>';

  if (ui.formOpen) h += tripForm(ui.draft || blankTrip());

  if (!sorted.length) {
    h += '<div class="card"><p class="empty" style="margin:0">No trips yet. Add one and it will show up on the dashboard ' +
         "and in the calendar.</p></div>";
  } else {
    for (var i = 0; i < sorted.length; i++) h += tripCard(sorted[i]);
  }

  el("view-trips").innerHTML = h;
}

/* =========================================================================
   Backup / Restore / Reset
   ========================================================================= */

function backupName() { return "runway-backup-" + todayISO() + ".json"; }

function serialise() { return JSON.stringify(state, null, 2); }

function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

function isStandalone() {
  if (navigator.standalone) return true;
  return !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
}

function canShareFile(file) {
  try {
    return !!(file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] }));
  } catch (e) { return false; }
}

/* Returns false when the browser ignores the download attribute, so the
   caller can fall back instead of claiming a save that never happened. */
function anchorDownload(text, name) {
  var a = document.createElement("a");
  if (!("download" in a)) return false;
  var url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.href = url;
  a.download = name;
  a.rel = "noopener";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  return true;
}

function shareFile(file, name, onFail) {
  navigator.share({ files: [file], title: name }).then(function () {
    toast("Backup shared — choose Save to Files.");
  })["catch"](function (e) {
    if (e && e.name === "AbortError") return;   /* user dismissed the sheet */
    onFail();
  });
}

/* WebKit only accepts a subset of file types in the share sheet, so try the
   honest type first and fall back to text/plain keeping the .json name. */
function shareCandidate(text, name) {
  var types = ["application/json", "text/plain"];
  for (var i = 0; i < types.length; i++) {
    var f;
    try { f = new File([text], name, { type: types[i] }); }
    catch (e) { return null; }
    if (canShareFile(f)) return f;
  }
  return null;
}

function doExport() {
  var text = serialise();
  var name = backupName();

  /* iOS ignores <a download> for blob URLs, and on the home screen there is no
     address bar to escape a blob navigation — the share sheet is the only
     route to Files/iCloud. */
  if (isIOS() || isStandalone()) {
    var shareable = shareCandidate(text, name);
    if (shareable) { shareFile(shareable, name, function () { showBackupText(text, name); }); }
    else { showBackupText(text, name); }
    return;
  }

  if (anchorDownload(text, name)) { toast("Backup saved as " + name); return; }

  var f = shareCandidate(text, name);
  if (f) { shareFile(f, name, function () { showBackupText(text, name); }); return; }

  showBackupText(text, name);
}

/* Last resort: put the JSON on screen so it can always be copied out. */
function showBackupText(text, name) {
  var old = el("sheet");
  if (old) old.parentNode.removeChild(old);

  var wrap = document.createElement("div");
  wrap.className = "sheet";
  wrap.id = "sheet";
  wrap.innerHTML =
    '<div class="sheet-card">' +
      '<div class="card-head"><span class="label">Backup · ' + esc(name) + "</span>" +
        '<button class="btn small" data-sheet="close">Close</button></div>' +
      '<p class="hint" style="margin:0 0 9px">This browser won\u2019t hand over a file. Copy everything below into a ' +
        "note or a text file and keep it \u2014 Restore reads it straight back.</p>" +
      '<textarea class="sheet-text" readonly></textarea>' +
      '<div class="row" style="margin-top:10px">' +
        '<button class="btn primary grow" data-sheet="copy">Copy to clipboard</button></div>' +
    "</div>";

  var ta = wrap.querySelector(".sheet-text");
  ta.value = text;

  wrap.addEventListener("click", function (ev) {
    var n = ev.target;
    var what = n.getAttribute && n.getAttribute("data-sheet");
    if (what === "close" || n === wrap) {
      wrap.parentNode.removeChild(wrap);
    } else if (what === "copy") {
      ta.focus();
      ta.setSelectionRange(0, ta.value.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      if (ok) { toast("Copied. Paste it somewhere safe."); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(function () {
          toast("Copied. Paste it somewhere safe.");
        })["catch"](function () { toast("Select the text and copy it manually."); });
      } else {
        toast("Select the text and copy it manually.");
      }
    }
  });

  document.body.appendChild(wrap);
}

function applyImported(text, label) {
  var parsed;
  try { parsed = JSON.parse(text); }
  catch (e) { toast("That file isn't valid JSON."); return false; }
  if (!parsed || typeof parsed !== "object") { toast("That file doesn't look like a Runway backup."); return false; }
  var next = migrate(parsed);
  var msg = "Replace everything on this device with " + (label || "this file") + "?\n\n" +
            next.trips.length + " trip(s) will be loaded. Your current data will be overwritten.";
  if (!window.confirm(msg)) return false;
  state = next;
  save();
  render();
  toast("Restored " + next.trips.length + " trip(s).");
  return true;
}

function doImport() { el("importer").click(); }

function doReset() {
  if (!window.confirm("Reset everything?\n\nBudget, categories and all trips on this device will be cleared. " +
                      "This can't be undone — export a backup first if you want to keep it.")) return;
  state = defaultState();
  ui.openTrip = null; ui.formOpen = false; ui.editingId = null; ui.draft = null;
  save();
  render();
  toast("Cleared. Empty and ready.");
}

/* =========================================================================
   Optional: bind to a real local file (File System Access API)
   Desktop Chromium/Edge only — hidden entirely on iPad Safari.
   ========================================================================= */

var fsState = { handle: null, name: "" };
var fsTimer = null;

function hasFSA() {
  return !!(window.showSaveFilePicker && window.showOpenFilePicker);
}

function idb(cb) {
  if (!window.indexedDB) { cb(null); return; }
  var req;
  try { req = indexedDB.open("runway-fs", 1); }
  catch (e) { cb(null); return; }
  req.onupgradeneeded = function () { req.result.createObjectStore("handles"); };
  req.onsuccess = function () { cb(req.result); };
  req.onerror = function () { cb(null); };
}

function idbPut(key, val) {
  idb(function (db) {
    if (!db) return;
    try { db.transaction("handles", "readwrite").objectStore("handles").put(val, key); } catch (e) {}
  });
}

function idbGet(key, cb) {
  idb(function (db) {
    if (!db) { cb(null); return; }
    try {
      var r = db.transaction("handles", "readonly").objectStore("handles").get(key);
      r.onsuccess = function () { cb(r.result || null); };
      r.onerror = function () { cb(null); };
    } catch (e) { cb(null); }
  });
}

function fsStatus(msg) {
  var n = el("fs-status");
  if (n) n.textContent = msg;
}

function writeHandle(handle) {
  return handle.createWritable().then(function (w) {
    return w.write(serialise()).then(function () { return w.close(); });
  });
}

/* Debounced mirror of state into the bound file. */
function fileSync() {
  if (!fsState.handle) return;
  if (fsTimer) clearTimeout(fsTimer);
  fsTimer = setTimeout(function () {
    writeHandle(fsState.handle).then(function () {
      fsStatus("Auto-saved to " + fsState.name + " · " + new Date().toLocaleTimeString());
    })["catch"](function () {
      fsStatus("Couldn't write to " + fsState.name + " — re-link the file.");
    });
  }, 600);
}

function linkFile() {
  window.showSaveFilePicker({
    suggestedName: "runway-data.json",
    types: [{ description: "Runway data", accept: { "application/json": [".json"] } }]
  }).then(function (handle) {
    fsState.handle = handle;
    fsState.name = handle.name;
    idbPut("data", handle);
    return writeHandle(handle);
  }).then(function () {
    toast("Linked. Changes now auto-save to the file.");
    render();
  })["catch"](function (e) {
    if (e && e.name === "AbortError") return;
    toast("Couldn't link that file.");
  });
}

function openFile() {
  window.showOpenFilePicker({
    types: [{ description: "Runway data", accept: { "application/json": [".json"] } }],
    multiple: false
  }).then(function (handles) {
    var handle = handles[0];
    return handle.getFile().then(function (f) { return f.text(); }).then(function (txt) {
      if (applyImported(txt, handle.name)) {
        fsState.handle = handle;
        fsState.name = handle.name;
        idbPut("data", handle);
        render();
      }
    });
  })["catch"](function (e) {
    if (e && e.name === "AbortError") return;
    toast("Couldn't open that file.");
  });
}

function restoreHandle() {
  if (!hasFSA()) return;
  idbGet("data", function (handle) {
    if (!handle || !handle.queryPermission) return;
    handle.queryPermission({ mode: "readwrite" }).then(function (p) {
      if (p !== "granted") return;   /* re-granting needs a user gesture */
      fsState.handle = handle;
      fsState.name = handle.name;
      if (ui.tab === "dash") render();
    })["catch"](function () {});
  });
}

/* =========================================================================
   Rendering + events
   ========================================================================= */

function render() {
  if (ui.tab === "dash") renderDash();
  else if (ui.tab === "cal") renderCal();
  else renderTrips();
}

function setTab(tab) {
  ui.tab = tab;
  var tabs = document.querySelectorAll(".tab");
  for (var i = 0; i < tabs.length; i++) {
    var on = tabs[i].getAttribute("data-tab") === tab;
    tabs[i].classList.toggle("is-on", on);
    tabs[i].setAttribute("aria-selected", on ? "true" : "false");
  }
  el("view-dash").hidden = tab !== "dash";
  el("view-cal").hidden = tab !== "cal";
  el("view-trips").hidden = tab !== "trips";
  render();
  window.scrollTo(0, 0);
}

function jumpTo(dISO) {
  var d = parseISO(dISO);
  if (!d) return;
  ui.calYear = d.getFullYear();
  ui.calMonth = d.getMonth();
  ui.selDay = dISO;
  ui.tab === "cal" ? render() : setTab("cal");
}

/* Adds a category, steering away from duplicates of the seeds or of the
   user's own earlier additions. */
function addCategory(rawLabel) {
  var label = String(rawLabel || "").trim().replace(/\s+/g, " ");
  if (!label) { toast("Name the category first."); return; }
  if (label.length > 24) { toast("Keep the name under 24 characters."); return; }

  var key = catKey(label);
  if (!key) { toast("Use some letters or numbers."); return; }

  var list = cats(), i;

  /* exact match once normalised — accents, case, plurals and spacing ignored */
  for (i = 0; i < list.length; i++) {
    if (catKey(list[i].label) === key || list[i].k === key) {
      toast("\u201c" + list[i].label + "\u201d already covers that \u2014 use it instead.");
      return;
    }
  }

  /* near match — a typo or a near-synonym of something already there */
  for (i = 0; i < list.length; i++) {
    var other = catKey(list[i].label);
    var close = editDistance(key, other) <= 2 ||
                (key.length >= 4 && other.length >= 4 && (key.indexOf(other) === 0 || other.indexOf(key) === 0));
    if (!close) continue;
    if (!window.confirm("\u201c" + label + "\u201d looks a lot like your existing \u201c" + list[i].label +
                        "\u201d.\n\nSplitting them means the same spend lands in two places. Add it anyway?")) {
      return;
    }
    break;
  }

  var finalKey = key, bump = 2;
  for (i = 0; i < list.length; i++) {
    if (list[i].k === finalKey) { finalKey = key + bump; bump++; i = -1; }
  }
  key = finalKey;
  state.categories.push({ k: key, label: label, c: nextCatColour(state.categories), custom: true });
  ui.newCatOpen = false;
  ui.newCatText = "";
  save();

  /* a category is added in order to be used, so open a row on it */
  var fresh = null;
  if (ui.formOpen) {
    ui.draft = readForm();
    fresh = blankExpense(key);
    ui.draft.expenses.push(fresh);
  }
  renderTrips();
  if (fresh) {
    var n = el("f-exp-" + fresh.id + "-amt");
    if (n) n.focus();
  }
  toast("Added " + label + ".");
}

/* A stored trip may predate a category, so top it up before editing. */
function migrateTrip(t) {
  var out = {
    id: t.id, name: t.name, countries: (t.countries || []).slice(),
    start: t.start, end: t.end, status: t.status, notes: t.notes,
    expenses: []
  };
  var src = t.expenses || [];
  for (var i = 0; i < src.length; i++) {
    out.expenses.push({
      id: src[i].id, cat: src[i].cat, label: src[i].label,
      amount: num(src[i].amount), url: src[i].url || ""
    });
  }
  if (!out.expenses.length) out.expenses.push(blankExpense());
  return out;
}

document.addEventListener("click", function (ev) {
  var btn = null;
  var n = ev.target;
  while (n && n !== document) {
    if (n.getAttribute && (n.getAttribute("data-act") || n.getAttribute("data-tab"))) { btn = n; break; }
    n = n.parentNode;
  }
  if (!btn) return;

  var tab = btn.getAttribute("data-tab");
  if (tab) { setTab(tab); return; }

  var act = btn.getAttribute("data-act");
  var v = btn.getAttribute("data-v");

  switch (act) {
    case "year":
      ui.year += parseInt(v, 10);
      ui.paceMonth = null;
      render();
      break;

    case "budget-date":
      ui.budgetDateOpen = !ui.budgetDateOpen;
      render();
      var fromIn = el("budget-from");
      if (fromIn) fromIn.focus();
      break;

    case "pace-month":
      var mi = parseInt(v, 10);
      ui.paceMonth = ui.paceMonth === mi ? null : mi;
      render();
      break;

    case "calview":
      ui.calView = v;
      if (v === "week" && !ui.weekStart) {
        ui.weekStart = iso(weekStartOf(parseISO(ui.selDay) || new Date(ui.calYear, ui.calMonth, 1)));
      }
      render();
      break;

    case "calnav":
      var step = parseInt(v, 10);
      if (ui.calView === "year") {
        ui.calYear += step;
      } else if (ui.calView === "month") {
        ui.calMonth += step;
        if (ui.calMonth < 0) { ui.calMonth = 11; ui.calYear--; }
        if (ui.calMonth > 11) { ui.calMonth = 0; ui.calYear++; }
      } else {
        var ws = addDays(parseISO(ui.weekStart) || weekStartOf(new Date()), step * 7);
        ui.weekStart = iso(ws);
        ui.calYear = ws.getFullYear();
        ui.calMonth = ws.getMonth();
      }
      render();
      break;

    case "calzoom":          /* a day cell: zoom in and select it */
    case "calzoom-m":        /* a month label: zoom in, keep the selection */
      var zd = parseISO(v);
      if (!zd) return;
      ui.calYear = zd.getFullYear();
      ui.calMonth = zd.getMonth();
      ui.weekStart = iso(weekStartOf(zd));
      if (act === "calzoom") ui.selDay = v;
      ui.calView = "month";
      render();
      break;

    case "lens":
      ui.lens = v;
      render();
      break;

    case "day":
      var d = parseISO(v);
      ui.selDay = (ui.selDay === v) ? "" : v;
      if (d && ui.calView === "month" && d.getMonth() !== ui.calMonth) {
        ui.calMonth = d.getMonth();
        ui.calYear = d.getFullYear();
      }
      render();
      break;

    case "jump":
      jumpTo(v);
      break;

    /* ---- countries ---- */
    case "country-toggle":
      ui.countryOpen = !ui.countryOpen;
      ui.countryQuery = "";
      refreshForm(ui.countryOpen ? "f-country-q" : null);
      break;

    case "country-on":
      if (ui.formOpen) {
        ui.draft = readForm();
        var have = ui.draft.countries.indexOf(v);
        if (have >= 0) ui.draft.countries.splice(have, 1);
        else ui.draft.countries.push(v);
        renderTrips();
        var qn = el("f-country-q");
        if (qn) qn.focus();
      }
      break;

    case "country-off":
      if (ui.formOpen) {
        ui.draft = readForm();
        var idx = ui.draft.countries.indexOf(v);
        if (idx >= 0) ui.draft.countries.splice(idx, 1);
        renderTrips();
      }
      break;

    /* ---- categories ---- */
    case "cat-new":
      ui.newCatOpen = true;
      ui.newCatText = "";
      refreshForm("f-newcat");
      break;

    case "cat-cancel":
      ui.newCatOpen = false;
      ui.newCatText = "";
      refreshForm();
      break;

    case "cat-add":
      addCategory(el("f-newcat") ? el("f-newcat").value : "");
      break;

    case "cat-del":
      var goner = catByKey(v);
      if (!goner || catInUse(v)) { toast("That category has money in it."); return; }
      if (!window.confirm("Remove the " + goner.label + " category?")) return;
      for (var ci = 0; ci < state.categories.length; ci++) {
        if (state.categories[ci].k === v) { state.categories.splice(ci, 1); break; }
      }
      save();
      refreshForm();
      toast("Removed " + goner.label + ".");
      break;

    /* ---- expenses ---- */
    case "exp-add":
      if (ui.formOpen) {
        ui.draft = readForm();
        /* default to the first category this trip is not already using, so
           adding rows in a row still lands Flights, Lodging, Food */
        var listA = cats(), pick = null;
        for (var ai = 0; ai < listA.length; ai++) {
          if (!expensesInCat(ui.draft, listA[ai].k).length) { pick = listA[ai].k; break; }
        }
        var fresh = blankExpense(pick);
        ui.draft.expenses.push(fresh);
        renderTrips();
        var lab = el("f-exp-" + fresh.id + "-amt");
        if (lab) lab.focus();
      }
      break;

    case "exp-del":
      if (ui.formOpen) {
        ui.draft = readForm();
        for (var di = 0; di < ui.draft.expenses.length; di++) {
          if (ui.draft.expenses[di].id === v) { ui.draft.expenses.splice(di, 1); break; }
        }
        renderTrips();
      }
      break;

    /* ---- trips ---- */
    case "trip-new":
      ui.draft = blankTrip();
      ui.formOpen = true;
      ui.countryOpen = false;
      ui.newCatOpen = false;
      renderTrips();
      var nameIn = el("f-name"); if (nameIn) nameIn.focus();
      break;

    case "trip-cancel":
      ui.formOpen = false; ui.draft = null; ui.countryOpen = false; ui.newCatOpen = false;
      renderTrips();
      break;

    case "trip-save":
      var t = readForm();
      if (!t.name) { toast("Give the trip a name first."); el("f-name").focus(); return; }

      /* a link that is not http(s) is refused out loud rather than dropped */
      var bad = null;
      for (var vi = 0; vi < t.expenses.length; vi++) {
        var rawUrl = String(t.expenses[vi].url || "").trim();
        if (rawUrl && !safeUrl(rawUrl)) { bad = t.expenses[vi]; break; }
        t.expenses[vi].url = safeUrl(rawUrl);
        t.expenses[vi].label = String(t.expenses[vi].label || "").trim();
      }
      if (bad) {
        toast("Links need to start with http:// or https://");
        var badN = el("f-exp-" + bad.id + "-url");
        if (badN) { badN.focus(); badN.select && badN.select(); }
        return;
      }

      /* keep anything with money, a name, or a link; drop blank rows */
      var kept = [];
      for (var ki = 0; ki < t.expenses.length; ki++) {
        if (expenseWorthKeeping(t.expenses[ki])) kept.push(t.expenses[ki]);
      }
      t.expenses = kept;
      var existing = tripById(t.id);
      if (existing) {
        for (var i = 0; i < state.trips.length; i++) {
          if (state.trips[i].id === t.id) { state.trips[i] = t; break; }
        }
      } else {
        state.trips.push(t);
      }
      ui.formOpen = false; ui.draft = null; ui.countryOpen = false; ui.newCatOpen = false;
      save();
      render();
      toast("Saved " + t.name + " \u00b7 " + money(tripTotal(t)));
      break;

    case "trip-open":
      ui.openTrip = ui.openTrip === v ? null : v;
      renderTrips();
      break;

    case "trip-edit":
      var src = tripById(v);
      if (!src) return;
      ui.draft = migrateTrip(src);
      ui.formOpen = true; ui.openTrip = null; ui.countryOpen = false; ui.newCatOpen = false;
      renderTrips();
      var f = el("trip-form");
      if (f && f.scrollIntoView) f.scrollIntoView({ block: "start" });
      break;

    case "trip-del":
      var tt = tripById(v);
      if (!tt) return;
      if (!window.confirm("Delete " + (tt.name || "this trip") + "?")) return;
      for (var j = 0; j < state.trips.length; j++) {
        if (state.trips[j].id === v) { state.trips.splice(j, 1); break; }
      }
      if (ui.openTrip === v) ui.openTrip = null;
      if (ui.draft && ui.draft.id === v) { ui.draft = null; ui.formOpen = false; }
      save();
      render();
      toast("Deleted.");
      break;

    case "export": doExport(); break;
    case "import": doImport(); break;
    case "reset":  doReset();  break;
    case "link-file": linkFile(); break;
    case "open-file": openFile(); break;
  }
});

/* Live input: budget and trip category totals. */
document.addEventListener("input", function (ev) {
  var t = ev.target;
  if (!t || !t.id && !t.getAttribute) return;

  if (t.id === "budget") {
    var key = String(ui.year);
    var raw = t.value.replace(/[^\d.,\-]/g, "");
    if (raw === "") {
      delete state.budgetByYear[key];
    } else {
      var firstEntry = state.budgetByYear[key] == null;
      state.budgetByYear[key] = num(raw);
      /* A budget first set part-way through the current year is a budget for
         what is left of it, not for a year already mostly gone. Shown and
         editable, never a silent assumption. */
      if (firstEntry && state.budgetStartByYear[key] == null) {
        var now = new Date();
        if (now.getFullYear() === ui.year && !(now.getMonth() === 0 && now.getDate() === 1)) {
          state.budgetStartByYear[key] = todayISO();
        }
      }
    }
    save();
    refreshDashNumbers();
    return;
  }

  if (t.id === "budget-from") {
    var yk = String(ui.year);
    var picked = parseISO(t.value);
    if (picked && picked.getFullYear() === ui.year) {
      if (picked.getMonth() === 0 && picked.getDate() === 1) delete state.budgetStartByYear[yk];
      else state.budgetStartByYear[yk] = t.value;
      save();
      refreshDashNumbers();
    }
    return;
  }

  if (t.id === "f-country-q") {
    ui.countryQuery = t.value;
    var caret = t.selectionStart;
    renderTrips();
    var again = el("f-country-q");
    if (again) {
      again.focus();
      try { again.setSelectionRange(caret, caret); } catch (e) {}
    }
    return;
  }

  if (t.id === "f-newcat") { ui.newCatText = t.value; return; }

  if (t.className && t.className.indexOf("f-amt") >= 0) {
    var out = el("f-total");
    if (out) out.textContent = money(formTotal());
    return;
  }

  /* keep the row's colour dot honest when its category changes */
  if (t.className && t.className.indexOf("f-ecat") >= 0) {
    var picked = catByKey(t.value);
    var dot = t.parentNode ? t.parentNode.querySelector("i") : null;
    if (dot && picked) dot.style.background = picked.c;
  }
});

/* Update the dashboard without re-rendering (keeps focus in the budget field). */
var dashTimer = null;
function refreshDashNumbers() {
  if (dashTimer) clearTimeout(dashTimer);
  dashTimer = setTimeout(function () {
    if (ui.tab !== "dash") return;
    var focus = document.activeElement;
    var id = focus && focus.id;
    var caret = null;
    if (id === "budget" && focus.selectionStart != null) caret = focus.selectionStart;
    renderDash();
    if (id) {
      var again = el(id);
      if (again) {
        again.focus();
        if (caret != null && again.setSelectionRange) {
          try { again.setSelectionRange(caret, caret); } catch (e) {}
        }
      }
    }
  }, 220);
}

document.addEventListener("keydown", function (ev) {
  if (ev.key !== "Enter") return;
  var t = ev.target;
  if (t && t.id === "f-newcat") { ev.preventDefault(); addCategory(t.value); }
});

el("importer").addEventListener("change", function (ev) {
  var file = ev.target.files && ev.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () { applyImported(String(reader.result), file.name); };
  reader.onerror = function () { toast("Couldn't read that file."); };
  reader.readAsText(file);
  ev.target.value = "";
});

/* =========================================================================
   Boot
   ========================================================================= */

function init() {
  load();

  var now = new Date();
  ui.year = now.getFullYear();
  ui.calYear = PLANNING_YEAR;
  ui.calMonth = now.getFullYear() === PLANNING_YEAR ? now.getMonth() : 0;
  ui.selDay = now.getFullYear() === PLANNING_YEAR ? todayISO() : "";
  ui.weekStart = iso(weekStartOf(now.getFullYear() === PLANNING_YEAR ? now : new Date(PLANNING_YEAR, 0, 1)));

  /* If migration reshaped a stored file, write the normalised version back now
     rather than leaving retired keys around until the next edit. Untouched
     storage — and a first run with none — is left alone. */
  if (loadedRaw && loadedRaw !== JSON.stringify(state)) save();

  setTab("dash");
  restoreHandle();

  if (!ui.storageOK) toast("Local storage is blocked — use Backup to keep your data.");
}

init();

window.addEventListener("load", function () {
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () { /* offline support is optional */ });
  }
});

})();
</script>
