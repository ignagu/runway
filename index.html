<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Runway — Family Travel Budget</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF2F6">
<meta name="description" content="Offline-first planner for family travel and an annual travel budget.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Runway">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#0B1E33; --ink2:#123055; --paper:#EEF2F6; --page:#E6ECF2;
  --go:#1F9D6B; --amber:#E39A2B; --over:#CE3F34; --line:#D6DEE6;
  --muted:#5C6C7C; --text:#17222F;
  --es:#C63F35; --se:#2E6DB4; --trip:#1F9D6B;
  --spent:#E0A526; --alloc:#1F9D6B; --free:#cdd6e0; --overbar:#E8695E;
  --display:"Space Grotesk", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"Space Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(11,30,51,.06), 0 6px 18px rgba(11,30,51,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--text); font-family:var(--body);
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-env: 0;
}
.app{
  max-width:560px; margin:0 auto; padding:0 14px 64px;
  padding-left:calc(14px + env(safe-area-inset-left));
  padding-right:calc(14px + env(safe-area-inset-right));
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}

/* ---------- header + tabs ---------- */
.topbar{padding:calc(18px + env(safe-area-inset-top)) 2px 12px}
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted);
}
.brand{
  font-family:var(--display); font-weight:700; font-size:30px; line-height:1.1;
  letter-spacing:-.015em; color:var(--ink); margin:2px 0 0;
}
.tabs{
  display:flex; gap:4px; background:#fff; border:1px solid var(--line);
  border-radius:12px; padding:4px; box-shadow:var(--shadow); position:sticky; top:8px; z-index:20;
}
.tab{
  flex:1; appearance:none; border:0; background:transparent; border-radius:9px;
  padding:9px 6px; font-family:var(--body); font-weight:600; font-size:14px;
  color:var(--muted); cursor:pointer;
}
.tab.is-on{background:var(--ink); color:#fff}

/* ---------- generic ---------- */
.view{padding-top:14px}
.view[hidden]{display:none}
.card{
  background:#fff; border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:14px; margin-bottom:12px;
}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px}
.label{
  font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
}
.hint{font-size:12.5px; color:var(--muted); line-height:1.5}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.row{display:flex; gap:8px}
.grow{flex:1}
button{font-family:var(--body)}
.btn{
  appearance:none; border:1px solid var(--line); background:#fff; color:var(--ink);
  border-radius:10px; padding:10px 12px; font-size:14px; font-weight:600; cursor:pointer;
}
.btn:active{background:var(--paper)}
.btn.primary{background:var(--ink); border-color:var(--ink); color:#fff}
.btn.danger{color:var(--over); border-color:#EBC7C3}
.btn.small{padding:7px 10px; font-size:13px; font-weight:600}
.btn[disabled]{opacity:.45}
.stepper{
  appearance:none; border:1px solid var(--line); background:#fff; color:var(--ink);
  width:34px; height:34px; border-radius:9px; font-size:17px; line-height:1; cursor:pointer;
}
input,select,textarea{
  font-family:var(--body); font-size:16px; color:var(--text);
  background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 11px; width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid #B9CBE0; outline-offset:1px}
textarea{resize:vertical; min-height:64px}
input.num-in{font-family:var(--mono); font-variant-numeric:tabular-nums}
.field{margin-bottom:10px}
.field > .label{display:block; margin-bottom:5px}
/* Start/End dates. A native date control has a wide intrinsic minimum —
   wider on iOS Safari than on Chromium — so a fixed 1fr 1fr forced each field
   past half the row and the two collided. auto-fit drops to a single column
   whenever two real controls will not fit, which is content-driven rather than
   a guessed breakpoint: side by side on tablet and desktop, stacked on phones. */
.two{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px}
.two > .field{min-width:0}
.two input{min-width:0}
.two input[type="date"]{padding-left:9px; padding-right:9px}
.seg{display:flex; gap:4px; background:var(--paper); border:1px solid var(--line); border-radius:11px; padding:3px}
.seg button{
  flex:1; appearance:none; border:0; background:transparent; border-radius:8px; padding:7px 4px;
  font-size:13px; font-weight:600; color:var(--muted); cursor:pointer;
}
.seg button.is-on{background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(11,30,51,.12)}

/* ---------- dashboard ---------- */
.yearsw{display:flex; align-items:center; gap:8px}
.yearsw .y{font-family:var(--mono); font-weight:700; font-size:15px; color:var(--ink); min-width:46px; text-align:center}
.budget-in{display:flex; align-items:baseline; gap:8px; margin-top:2px}
.budget-in .cur{font-family:var(--mono); font-size:22px; color:var(--muted)}
#budget{
  border:0; border-bottom:2px solid var(--line); border-radius:0; padding:4px 0;
  font-family:var(--mono); font-weight:700; font-size:30px; letter-spacing:-.01em; color:var(--ink);
}
#budget:focus{outline:0; border-bottom-color:var(--ink)}
.bwin{display:flex; align-items:center; gap:9px; margin-top:9px; flex-wrap:wrap}
.bwin .hint b{color:var(--ink); font-weight:600}
.bwin input[type="date"]{flex:1; min-width:150px; padding:7px 9px}
.bwin .label{flex:0 0 auto}
.mcol.out{opacity:.4}
.mlabels span.out{opacity:.45}
.mdiv{position:absolute; top:-2px; bottom:-2px; width:0; border-left:1px dashed #A9B6C4; pointer-events:none}
.hero .big{
  font-family:var(--mono); font-weight:700; font-size:38px; letter-spacing:-.02em;
  color:var(--ink); line-height:1.05; margin:2px 0 2px;
}
.hero .big.is-over{color:var(--over)}
.bar{display:flex; height:12px; border-radius:99px; overflow:hidden; background:var(--paper); border:1px solid var(--line); margin:12px 0 8px}
.bar i{display:block; height:100%}
.legend{display:flex; flex-wrap:wrap; gap:10px 14px}
.legend span{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted)}
.legend b{width:9px; height:9px; border-radius:3px; display:inline-block}
.legend em{font-style:normal; font-family:var(--mono); color:var(--text)}
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px}
.tile{
  background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
  padding:11px 10px;
}
.tile .label{font-size:9.5px; letter-spacing:.09em}
.tile .v{font-family:var(--mono); font-weight:700; font-size:17px; color:var(--ink); margin-top:5px; letter-spacing:-.02em}
.tile .v.is-over{color:var(--over)}
.nudge{
  display:flex; gap:9px; align-items:flex-start; background:#fff; border:1px solid var(--line);
  border-left:3px solid var(--go); border-radius:12px; padding:11px 12px; margin-bottom:12px;
  box-shadow:var(--shadow); font-size:13.5px; line-height:1.5;
}
.nudge .dot{width:8px; height:8px; border-radius:99px; background:var(--go); margin-top:6px; flex:0 0 auto}

/* pacing */
.pace-wrap{margin-top:4px}
.pace-track{position:relative; height:16px; background:var(--paper); border:1px solid var(--line); border-radius:99px; overflow:hidden}
.pace-fill{position:absolute; inset:0 auto 0 0; border-radius:99px}
.pace-now{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); border-radius:2px}
.pace-now:after{
  content:""; position:absolute; left:50%; top:-4px; width:7px; height:7px; margin-left:-3.5px;
  background:var(--ink); border-radius:99px;
}
.months{display:flex; justify-content:space-between; margin-top:5px}
.months span{font-family:var(--mono); font-size:9.5px; color:var(--muted); flex:1; text-align:center}
.verdict{display:flex; gap:8px; align-items:baseline; margin-top:11px}
.pill{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  padding:3px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); white-space:nowrap;
}
.pill.go{color:var(--go); border-color:#B7E0CD; background:#F0FAF6}
.pill.amber{color:#A9711A; border-color:#F0DDB8; background:#FDF6E9}
.pill.over{color:var(--over); border-color:#EBC7C3; background:#FDF0EF}
.pill.blue{color:var(--se); border-color:#C3D6EA; background:#F0F5FA}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:11px; border-top:1px solid var(--line); padding-top:10px}
.stats div .label{font-size:9.5px}
.stats div .v{font-family:var(--mono); font-weight:700; font-size:15px; color:var(--ink); margin-top:3px}

/* month-by-month bars */
.mwrap{margin-top:12px; border-top:1px solid var(--line); padding-top:11px}
.mchart{display:flex; align-items:flex-end; gap:2px; height:104px; position:relative}
.mcol{
  flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:2px; height:100%;
  appearance:none; background:transparent; border:0; padding:0; cursor:pointer; border-radius:4px;
}
.mcol i{display:block; width:74%; margin:0 auto; border-radius:2px}
.mcol i.top{border-radius:4px 4px 2px 2px}
.mcol.is-sel{outline:2px solid var(--ink); outline-offset:2px}
.mpace{position:absolute; left:0; right:0; height:0; border-top:1px dashed #A9B6C4; pointer-events:none}
.mlabels{display:flex; gap:2px; margin-top:5px}
.mlabels span{flex:1; text-align:center; font-family:var(--mono); font-size:9.5px; color:var(--muted)}
.mread{margin:8px 0 0}
.mread b{color:var(--ink)}

/* ---------- calendar ---------- */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.cal-title{font-family:var(--display); font-weight:700; font-size:19px; color:var(--ink)}
.dow{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:4px}
.dow span{font-family:var(--mono); font-size:10px; color:var(--muted); text-align:center}
.grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
.day{
  position:relative; appearance:none; border:1px solid transparent; background:transparent;
  border-radius:10px; padding:6px 0 12px; min-height:42px; cursor:pointer;
  font-family:var(--mono); font-size:13px; color:var(--text); text-align:center;
}
.day.out{color:#B3BEC9}
.day.off{background:var(--paper)}
.day.today{border-color:var(--ink); font-weight:700}
.day.sel{background:var(--ink); color:#fff; border-color:var(--ink)}
.day.sel.out{color:#8FA1B4}
.dots{position:absolute; left:0; right:0; bottom:5px; display:flex; gap:3px; justify-content:center}
.dots i{width:5px; height:5px; border-radius:99px; display:block}
.d-es{background:var(--es)} .d-se{background:var(--se)} .d-tr{background:var(--trip)}
/* year heatmap */
.ygrid{display:grid; grid-template-columns:26px repeat(31, 1fr); gap:1px; align-items:center}
.yhead{font-family:var(--mono); font-size:8px; color:var(--muted); text-align:center}
.ycorner{display:block}
.ymon{
  appearance:none; border:0; background:transparent; padding:0; cursor:pointer;
  font-family:var(--mono); font-size:9.5px; color:var(--muted); text-align:left;
}
.ycell{
  appearance:none; border:0; padding:0; cursor:pointer; aspect-ratio:1; min-height:9px;
  background:#fff; border-radius:2px; box-shadow:inset 0 0 0 1px var(--line); position:relative;
}
.ycell.off{background:var(--paper)}
.ycell.out{background:transparent; box-shadow:none; cursor:default}
.ycell.tr:after{content:""; position:absolute; left:1px; right:1px; bottom:1px; height:2px; background:var(--trip); border-radius:2px}
.ycell.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.ycell.sel{box-shadow:inset 0 0 0 2px var(--ink)}

/* week list */
.wlist{display:flex; flex-direction:column; gap:6px}
.wday{
  display:flex; gap:10px; width:100%; text-align:left; appearance:none; cursor:pointer;
  background:#fff; border:1px solid var(--line); border-radius:11px; padding:9px 11px;
}
.wday.off{background:var(--paper)}
.wday.today{border-color:var(--ink)}
.wday:active{background:var(--paper)}
.wdate{flex:0 0 34px; text-align:center}
.wdate b{display:block; font-family:var(--mono); font-weight:700; font-size:17px; color:var(--ink); line-height:1.1}
.wdate small{font-family:var(--mono); font-size:9.5px; color:var(--muted)}
.wbody{flex:1; min-width:0}
.wquiet{font-size:12.5px; color:var(--muted)}

.daycard{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-top:11px}
.daycard h4{margin:0 0 6px; font-family:var(--display); font-size:15px; color:var(--ink)}
.ev{display:flex; gap:8px; align-items:flex-start; padding:4px 0; font-size:13.5px}
.ev i{width:7px; height:7px; border-radius:99px; margin-top:6px; flex:0 0 auto}
.ev small{color:var(--muted); font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase}
.win{
  width:100%; text-align:left; appearance:none; background:#fff; border:1px solid var(--line);
  border-radius:11px; padding:10px 11px; margin-bottom:7px; cursor:pointer; display:block;
}
.win:active{background:var(--paper)}
.win .t{display:flex; justify-content:space-between; gap:10px; align-items:baseline}
.win .dates{font-family:var(--mono); font-weight:700; font-size:13.5px; color:var(--ink)}
.win .len{font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap}
.win .why{font-size:12.5px; color:var(--muted); margin-top:3px}
.win.bridge{border-style:dashed}
.empty{font-size:13px; color:var(--muted); padding:6px 0}

/* ---------- trips ---------- */
.trip{
  background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
  margin-bottom:9px; overflow:hidden;
}
.trip-top{display:block; width:100%; text-align:left; appearance:none; background:transparent; border:0; padding:12px; cursor:pointer}
.trip-top:active{background:var(--paper)}
.trip-name{display:block; font-family:var(--display); font-weight:700; font-size:16.5px; color:var(--ink); letter-spacing:-.01em}
.trip-meta{display:block; font-size:12.5px; color:var(--muted); margin-top:2px}
.trip-tot{font-family:var(--mono); font-weight:700; font-size:16px; color:var(--ink); white-space:nowrap}
.trip-bar{display:flex; height:5px; border-radius:99px; overflow:hidden; background:var(--paper); margin-top:9px}
.trip-bar i{display:block; height:100%}
.tag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  border:1px solid var(--line); border-radius:99px; padding:2px 7px; color:var(--muted);
}
.tag.s-Idea{color:var(--muted)}
.tag.s-Booked{color:var(--go); border-color:#B7E0CD}
.tag.s-Done{color:#8A94A0; background:var(--paper)}
.trip-body{border-top:1px solid var(--line); padding:12px; background:#FCFDFE}
.brk{display:flex; align-items:center; gap:9px; padding:4px 0; font-size:13px}
.brk .k{width:74px; color:var(--muted); flex:0 0 auto}
.brk .t{flex:1; height:7px; background:var(--paper); border-radius:99px; overflow:hidden}
.brk .t i{display:block; height:100%; border-radius:99px}
.brk .v{font-family:var(--mono); font-size:12.5px; width:74px; text-align:right; flex:0 0 auto}
.brk .p{font-family:var(--mono); font-size:11px; color:var(--muted); width:34px; text-align:right; flex:0 0 auto}
.notes{margin-top:9px; padding-top:9px; border-top:1px solid var(--line); font-size:13.5px; white-space:pre-wrap}
.exp{border:1px solid var(--line); border-radius:11px; padding:8px; margin-bottom:8px; background:#FCFDFE}
.exp-top{display:flex; align-items:center; gap:7px; margin-bottom:6px}
.exp-top i{width:9px; height:9px; border-radius:3px; flex:0 0 auto}
.exp-top select{flex:1; min-width:0; padding:8px 7px}
.exp-top input{width:82px; flex:0 0 auto; text-align:right; padding:8px 8px}
.exp input{margin-bottom:6px; padding:8px 9px}
.exp input:last-child{margin-bottom:0}
.exp .f-eurl{font-size:16px; color:var(--ink2)}
.explink{
  font-family:var(--mono); font-size:11.5px; color:var(--se); text-decoration:none;
  border-bottom:1px solid #C3D6EA; padding-bottom:1px; word-break:break-all;
}
.brk.sub{display:flex; align-items:baseline; gap:9px; padding:3px 0 3px 12px}
.brk.sub .sk{flex:1; min-width:0; color:var(--text); font-size:12.5px; line-height:1.4}
.brk.sub .sv{font-family:var(--mono); font-size:12.5px; color:var(--muted); flex:0 0 auto; white-space:nowrap}
.chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center; min-height:24px}
.chip{
  appearance:none; display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  background:var(--paper); border:1px solid var(--line); border-radius:99px;
  padding:5px 9px; font-size:13px; color:var(--text);
}
.chip .x{color:var(--muted); font-size:15px; line-height:1}
.cpick{margin-top:8px; border:1px solid var(--line); border-radius:11px; padding:8px; background:var(--paper)}
.clist{max-height:210px; overflow:auto; margin-top:7px; background:#fff; border:1px solid var(--line); border-radius:9px}
.crow{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; appearance:none;
  background:transparent; border:0; border-bottom:1px solid var(--line); padding:9px 10px;
  font-size:14px; color:var(--text); cursor:pointer;
}
.crow:last-child{border-bottom:0}
.crow.on{background:#F2F7FB}
.crow:active{background:var(--paper)}
.cflag{font-size:16px; line-height:1; flex:0 0 auto}
.cname{flex:1; min-width:0}
.ctick{color:var(--go); font-weight:700; flex:0 0 auto}
.catx{
  appearance:none; border:0; background:transparent; color:var(--muted); cursor:pointer;
  font-size:16px; line-height:1; padding:0 0 0 6px; flex:0 0 auto;
}
.newcat{display:flex; gap:6px; align-items:center; margin-top:8px}
.newcat input{flex:1}
.form-total{
  display:flex; justify-content:space-between; align-items:baseline; margin-top:11px;
  border-top:1px solid var(--line); padding-top:10px;
}
.form-total .v{font-family:var(--mono); font-weight:700; font-size:21px; color:var(--ink)}

/* ---------- misc ---------- */
.warn{background:#FDF6E9; border-color:#F0DDB8}
.sheet{
  position:fixed; inset:0; background:rgba(11,30,51,.45); z-index:60; display:flex;
  align-items:flex-end; justify-content:center; padding:14px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
}
.sheet-card{
  background:#fff; border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);
  padding:14px; width:100%; max-width:560px; max-height:82vh; overflow:auto;
}
.sheet-text{
  width:100%; min-height:38vh; font-family:var(--mono); font-size:16px; line-height:1.4;
  border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--paper);
}
#toast{
  position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(14px);
  background:var(--ink); color:#fff; padding:10px 15px; border-radius:11px; font-size:13.5px;
  box-shadow:0 8px 24px rgba(11,30,51,.28); opacity:0; pointer-events:none; transition:.18s; z-index:50;
  max-width:88vw; text-align:center;
}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.foot{text-align:center; color:var(--muted); font-size:11.5px; padding:6px 0 0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

<body>
<div class="app">
  <header class="topbar">
    <div class="eyebrow">Family travel · budget</div>
    <h1 class="brand">Runway</h1>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab is-on" role="tab" aria-selected="true" data-tab="dash">Dashboard</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="cal">Calendar</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="trips">Trips</button>
  </nav>

  <main>
    <section class="view" id="view-dash" role="tabpanel"></section>
    <section class="view" id="view-cal" role="tabpanel" hidden></section>
    <section class="view" id="view-trips" role="tabpanel" hidden></section>
  </main>

  <p class="foot">Your data stays on this device. Back it up to a file.</p>
</div>

<input type="file" id="importer" accept="application/json,.json" class="sr" aria-hidden="true">
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
"use strict";

/* =========================================================================
   Constants
   ========================================================================= */

var STORE_KEY = "runway-tracker-v1";
var PLANNING_YEAR = 2026;

var CURRENCIES = { EUR: "€", USD: "$", GBP: "£" };

/* Seed categories. Users add their own; the live list lives in state.categories. */

"CR Costa Rica|CU Cuba|CV Cabo Verde|CW Curaçao|CY Cyprus|CZ Czechia|DE Germany|DJ Djibouti|DK Denmark|" +
"DM Dominica|DO Dominican Republic|DZ Algeria|EC Ecuador|EE Estonia|EG Egypt|ER Eritrea|ES Spain|ET Ethiopia|" +

"HN Honduras|HR Croatia|HT Haiti|HU Hungary|ID Indonesia|IE Ireland|IL Israel|IM Isle of Man|IN India|IQ Iraq|" +
"IR Iran|IS Iceland|IT Italy|JE Jersey|JM Jamaica|JO Jordan|JP Japan|KE Kenya|KG Kyrgyzstan|KH Cambodia|" +
"KI Kiribati|KM Comoros|KN Saint Kitts and Nevis|KP North Korea|KR South Korea|KW Kuwait|KY Cayman Islands|" +
"KZ Kazakhstan|LA Laos|LB Lebanon|LC Saint Lucia|LI Liechtenstein|LK Sri Lanka|LR Liberia|LS Lesotho|" +
"LT Lithuania|LU Luxembourg|LV Latvia|LY Libya|MA Morocco|MC Monaco|MD Moldova|ME Montenegro|MG Madagascar|" +
"MH Marshall Islands|MK North Macedonia|ML Mali|MM Myanmar|MN Mongolia|MO Macao|MQ Martinique|MR Mauritania|" +
"MT Malta|MU Mauritius|MV Maldives|MW Malawi|MX Mexico|MY Malaysia|MZ Mozambique|NA Namibia|NC New Caledonia|" +
"NE Niger|NG Nigeria|NI Nicaragua|NL Netherlands|NO Norway|NP Nepal|NR Nauru|NZ New Zealand|OM Oman|PA Panama|" +
"PE Peru|PF French Polynesia|PG Papua New Guinea|PH Philippines|PK Pakistan|PL Poland|PR Puerto Rico|" +
"PS Palestine|PT Portugal|PW Palau|PY Paraguay|QA Qatar|RE Réunion|RO Romania|RS Serbia|RU Russia|RW Rwanda|" +
"SA Saudi Arabia|SB Solomon Islands|SC Seychelles|SD Sudan|SE Sweden|SG Singapore|SI Slovenia|SK Slovakia|" +
"SL Sierra Leone|SM San Marino|SN Senegal|SO Somalia|SR Suriname|SS South Sudan|ST São Tomé and Príncipe|" +
"SV El Salvador|SY Syria|SZ Eswatini|TC Turks and Caicos|TD Chad|TG Togo|TH Thailand|TJ Tajikistan|" +
"TL Timor-Leste|TM Turkmenistan|TN Tunisia|TO Tonga|TR Türkiye|TT Trinidad and Tobago|TV Tuvalu|TW Taiwan|" +
"TZ Tanzania|UA Ukraine|UG Uganda|US United States|UY Uruguay|UZ Uzbekistan|VA Vatican City|" +
"VC Saint Vincent and the Grenadines|VE Venezuela|VG British Virgin Islands|VI U.S. Virgin Islands|VN Vietnam|" +
"VU Vanuatu|WS Samoa|XK Kosovo|YE Yemen|ZA South Africa|ZM Zambia|ZW Zimbabwe").split("|");

var COUNTRY_NAME = {};
(function () {
  for (var i = 0; i < COUNTRIES.length; i++) {
    var row = COUNTRIES[i];
    COUNTRY_NAME[row.slice(0, 2)] = row.slice(3);
  }
})();

function flagOf(code) {
  if (!/^[A-Z]{2}$/.test(code)) return "";
  return String.fromCodePoint(0x1F1E6 + code.charCodeAt(0) - 65) +
         String.fromCodePoint(0x1F1E6 + code.charCodeAt(1) - 65);
}

function countryLabel(code) {
  var n = COUNTRY_NAME[code];
  return n ? flagOf(code) + " " + n : code;
}

var MONTHS = ["January","February","March","April","May","June",
              "July","August","September","October","November","December"];
var MON_SHORT = ["J","F","M","A","M","J","J","A","S","O","N","D"];
var MON_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

/* Baked-in 2026 holiday calendar. k: national | regional | local | observance */
var HOLIDAYS = [
  /* Spain — City of Madrid (national + Comunidad de Madrid + Madrid local) */
  { d: "2026-01-01", c: "ES", n: "Año Nuevo", k: "national" },
  { d: "2026-01-06", c: "ES", n: "Reyes / Epiphany", k: "national" },
  { d: "2026-04-02", c: "ES", n: "Jueves Santo", k: "regional" },
  { d: "2026-04-03", c: "ES", n: "Viernes Santo", k: "national" },
  { d: "2026-05-01", c: "ES", n: "Fiesta del Trabajo", k: "national" },
  { d: "2026-05-02", c: "ES", n: "Día de la Comunidad de Madrid", k: "regional" },
  { d: "2026-05-15", c: "ES", n: "San Isidro", k: "local" },
  { d: "2026-08-15", c: "ES", n: "Asunción", k: "national" },
  { d: "2026-10-12", c: "ES", n: "Fiesta Nacional / Hispanidad", k: "national" },
  { d: "2026-11-02", c: "ES", n: "Todos los Santos, observed", k: "national" },
  { d: "2026-11-09", c: "ES", n: "La Almudena", k: "local" },
  { d: "2026-12-07", c: "ES", n: "Constitución, observed", k: "national" },
  { d: "2026-12-08", c: "ES", n: "Inmaculada", k: "national" },
  { d: "2026-12-25", c: "ES", n: "Navidad", k: "national" },
  /* Sweden — röda dagar + key observances */
  { d: "2026-01-01", c: "SE", n: "Nyårsdagen", k: "national" },
  { d: "2026-01-06", c: "SE", n: "Trettondedag jul", k: "national" },
  { d: "2026-04-03", c: "SE", n: "Långfredagen", k: "national" },
  { d: "2026-04-05", c: "SE", n: "Påskdagen", k: "national" },
  { d: "2026-04-06", c: "SE", n: "Annandag påsk", k: "national" },
  { d: "2026-05-01", c: "SE", n: "Första maj", k: "national" },
  { d: "2026-05-14", c: "SE", n: "Kristi himmelsfärd", k: "national" },
  { d: "2026-05-24", c: "SE", n: "Pingstdagen", k: "national" },
  { d: "2026-06-06", c: "SE", n: "Sveriges nationaldag", k: "national" },
  { d: "2026-06-19", c: "SE", n: "Midsommarafton", k: "observance" },
  { d: "2026-06-20", c: "SE", n: "Midsommardagen", k: "national" },
  { d: "2026-10-31", c: "SE", n: "Alla helgons dag", k: "national" },
  { d: "2026-12-24", c: "SE", n: "Julafton", k: "observance" },
  { d: "2026-12-25", c: "SE", n: "Juldagen", k: "national" },
  { d: "2026-12-26", c: "SE", n: "Annandag jul", k: "national" },
  { d: "2026-12-31", c: "SE", n: "Nyårsafton", k: "observance" }
];

var HOL_BY_DAY = {};
(function () {
  for (var i = 0; i < HOLIDAYS.length; i++) {
    var h = HOLIDAYS[i];
    if (!HOL_BY_DAY[h.d]) HOL_BY_DAY[h.d] = [];
    HOL_BY_DAY[h.d].push(h);
  }
})();

/* =========================================================================
   Tiny helpers
   ========================================================================= */

function $(sel, root) { return (root || document).querySelector(sel); }
function el(id) { return document.getElementById(id); }

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function num(v) {
  var n = typeof v === "number" ? v : parseFloat(String(v == null ? "" : v).replace(",", "."));
  return isFinite(n) ? n : 0;
}

function clamp(n, lo, hi) { return n < lo ? lo : (n > hi ? hi : n); }

function pad2(n) { return (n < 10 ? "0" : "") + n; }

function iso(dt) { return dt.getFullYear() + "-" + pad2(dt.getMonth() + 1) + "-" + pad2(dt.getDate()); }

/* Parse "YYYY-MM-DD" as a *local* date (avoids UTC shifting the day). */
function parseISO(s) {
  if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  var p = s.split("-");
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return isNaN(d.getTime()) ? null : d;
}

function addDays(dt, n) { return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + n); }

/* Monday = 0 ... Sunday = 6 */
function dowMon(dt) { return (dt.getDay() + 6) % 7; }

function todayISO() { return iso(new Date()); }

function money(n) {
  var sym = CURRENCIES[state.currency] || CURRENCIES[DEFAULT_CURRENCY];
  var raw = num(n);
  var neg = raw < 0;
  var v = Math.round(Math.abs(raw));   /* round the magnitude so ±x.5 agree */
  var s = String(v).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (neg ? "\u2212" : "") + sym + s;
}

function intFmt(n) {
  return String(Math.round(num(n))).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

function pct(n) { return Math.round(n * 100) + "%"; }

function fmtDay(dt) {
  return DOW[dowMon(dt)] + " " + dt.getDate() + " " + MONTHS[dt.getMonth()].slice(0, 3);
}

function fmtRange(a, b) {
  var da = parseISO(a), db = parseISO(b);
  if (!da && !db) return "No dates";
  if (da && !db) return fmtDay(da);
  if (!da && db) return "→ " + fmtDay(db);
  if (a === b) return fmtDay(da);
  return fmtDay(da) + " – " + fmtDay(db);
}

var toastTimer = null;
function toast(msg) {
  var t = el("toast");
  t.textContent = msg;
  t.classList.add("on");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("on"); }, 2600);
}

function uid() {
  return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* =========================================================================
   State + persistence
   ========================================================================= */

/* --- category helpers --------------------------------------------------- */

/* Normalised comparison key: accent-free, lowercase, alphanumeric, de-pluralised. */
function catKey(label) {
  var s2 = String(label == null ? "" : label);
  if (s2.normalize) s2 = s2.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  s2 = s2.toLowerCase().replace(/[^a-z0-9]+/g, "");
  if (s2.length > 3 && s2.charAt(s2.length - 1) === "s") s2 = s2.slice(0, -1);
  return s2;
}

function titleise(k) {
  var s2 = String(k).replace(/[_-]+/g, " ").trim();
  return s2 ? s2.charAt(0).toUpperCase() + s2.slice(1) : s2;
}

function nextCatColour(list) {
  for (var i = 0; i < CAT_PALETTE.length; i++) {
    var used = false;
    for (var j = 0; j < list.length; j++) if (list[j].c === CAT_PALETTE[i]) used = true;
    if (!used) return CAT_PALETTE[i];
  }
  return CAT_PALETTE[list.length % CAT_PALETTE.length];
}

/* Edit distance, capped — used to catch near-duplicate category names. */
function editDistance(a, b) {
  if (a === b) return 0;
  if (!a.length || !b.length) return Math.max(a.length, b.length);
  var prev = [], cur = [], i, j;
  for (j = 0; j <= b.length; j++) prev[j] = j;
  for (i = 1; i <= a.length; i++) {
    cur[0] = i;
    for (j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
                        prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
    }
    for (j = 0; j <= b.length; j++) prev[j] = cur[j];
  }
  return prev[b.length];
}

function matchCountry(text) {
  var q = String(text).trim();
  if (!q) return null;
  var up = q.toUpperCase();
  if (COUNTRY_NAME[up]) return up;
  var low = q.toLowerCase();
  for (var code in COUNTRY_NAME) {
    if (!Object.prototype.hasOwnProperty.call(COUNTRY_NAME, code)) continue;
    if (COUNTRY_NAME[code].toLowerCase() === low) return code;
  }
  return null;
}

/* The live category list. Never mutate the seed array. */
function cats() { return state.categories; }

function catByKey(k) {
  var c = cats();
  for (var i = 0; i < c.length; i++) if (c[i].k === k) return c[i];
  return null;
}

function blankExpense(catk) {
  return { id: uid(), cat: catk || (cats()[0] && cats()[0].k) || "other", label: "", amount: 0, url: "" };
}

/* Only http/https survive. The app renders through innerHTML, so a stored
   javascript: or data: URL would be live code rather than inert text. */
function safeUrl(u) {
  var v = String(u == null ? "" : u).trim();
  if (!v) return "";
  return /^https?:\/\/[^\s]+$/i.test(v) ? v : "";
}

function linkHost(u) {
  try {
    var h = new URL(u).hostname.replace(/^www\./i, "");
    return h || u;
  } catch (e) {
    return u.replace(/^https?:\/\//i, "").split("/")[0] || u;
  }
}

/* An expense worth keeping: it has money, a name, or a link to come back to.
   A zero-amount expense carrying a link is the whole point — a hotel found
   but not yet booked. */
function expenseWorthKeeping(e) {
  return num(e.amount) !== 0 || String(e.label || "").trim() !== "" || safeUrl(e.url) !== "";
}

function seedCats() {
  var out = [];
  for (var i = 0; i < DEFAULT_CATS.length; i++) {
    out.push({ k: DEFAULT_CATS[i].k, label: DEFAULT_CATS[i].label, c: DEFAULT_CATS[i].c, custom: false });
  }
  return out;
}

function defaultState() {
  return {
    budgetByYear: {},
    budgetStartByYear: {},   /* "YYYY": "YYYY-MM-DD" — absent means 1 Jan */
    currency: DEFAULT_CURRENCY,
    categories: seedCats(),
    trips: []
  };
}

var state = defaultState();

var ui = {
  tab: "dash",
  year: new Date().getFullYear(),
  paceMonth: null,        /* month selected in the month-by-month chart */
  budgetDateOpen: false,  /* editing the budget's start date */
  calYear: PLANNING_YEAR,
  calMonth: 0,
  calView: "month",       /* year | month | week */
  weekStart: "",          /* ISO Monday of the shown week */
  selDay: "",
  lens: "both",           /* both | ES | SE */
  draft: null,            /* the trip being edited/created */
  formOpen: false,
  countryOpen: false,
  countryQuery: "",
  newCatOpen: false,
  newCatText: "",
  openTrip: null,         /* expanded trip id */
  storageOK: true
};

/* Accepts older/partial shapes and normalises everything. */
function migrate(raw) {
  var s = defaultState();
  if (!raw || typeof raw !== "object") return s;

  /* budget: object per year, or a bare number from an early shape */
  if (raw.budgetByYear && typeof raw.budgetByYear === "object") {
    for (var y in raw.budgetByYear) {
      if (!Object.prototype.hasOwnProperty.call(raw.budgetByYear, y)) continue;
      if (/^\d{4}$/.test(String(y))) s.budgetByYear[String(y)] = num(raw.budgetByYear[y]);
    }
  } else if (raw.budget != null) {
    s.budgetByYear[String(raw.year || PLANNING_YEAR)] = num(raw.budget);
  }

  if (raw.budgetStartByYear && typeof raw.budgetStartByYear === "object") {
    for (var by in raw.budgetStartByYear) {
      if (!Object.prototype.hasOwnProperty.call(raw.budgetStartByYear, by)) continue;
      var bv = raw.budgetStartByYear[by];
      /* a start date only makes sense inside its own year */
      if (/^\d{4}$/.test(String(by)) && /^\d{4}-\d{2}-\d{2}$/.test(bv || "") && bv.slice(0, 4) === String(by)) {
        s.budgetStartByYear[String(by)] = bv;
      }
    }
  }

  if (raw.currency && CURRENCIES[raw.currency]) s.currency = raw.currency;

  /* categories: keep user-made ones, always keep the seeds */
  if (raw.categories && Object.prototype.toString.call(raw.categories) === "[object Array]") {
    for (var ci = 0; ci < raw.categories.length; ci++) {
      var rc = raw.categories[ci] || {};
      /* identity is the stored key verbatim — catKey() is only ever used to
         compare human names, and would fold "flights" into "flight" here */
      var key = String(rc.k || "").toLowerCase().replace(/[^a-z0-9]/g, "");
      if (!key) key = catKey(String(rc.label || ""));
      if (!key) continue;
      var known = false;
      for (var si = 0; si < s.categories.length; si++) if (s.categories[si].k === key) known = true;
      if (known) continue;
      s.categories.push({
        k: key,
        label: String(rc.label || key),
        c: /^#[0-9A-Fa-f]{6}$/.test(rc.c || "") ? rc.c : nextCatColour(s.categories),
        custom: true
      });
    }
  }

  var trips = raw.trips;
  if (!trips || Object.prototype.toString.call(trips) !== "[object Array]") trips = [];
  for (var i = 0; i < trips.length; i++) {
    var t = trips[i] || {};

    /* --- expenses -----------------------------------------------------
       Newest shape is a list. Older files carry a flat breakdown map, and
       older ones still a single cost. Convert rather than drop. */
    function ensureCat(k, labelHint) {
      var key = String(k || "").toLowerCase().replace(/[^a-z0-9]/g, "");
      if (!key) key = "other";
      for (var kj = 0; kj < s.categories.length; kj++) if (s.categories[kj].k === key) return key;
      s.categories.push({
        k: key, label: titleise(labelHint || key), c: nextCatColour(s.categories), custom: true
      });
      return key;
    }

    var exps = [];
    var rawE = t.expenses;
    if (Object.prototype.toString.call(rawE) === "[object Array]") {
      for (var ei = 0; ei < rawE.length; ei++) {
        var re = rawE[ei] || {};
        var one = {
          id: re.id ? String(re.id) : uid(),
          cat: ensureCat(re.cat, re.cat),
          label: String(re.label == null ? "" : re.label),
          amount: num(re.amount),
          url: safeUrl(re.url)
        };
        if (expenseWorthKeeping(one)) exps.push(one);
      }
    } else {
      var src = (t.breakdown && typeof t.breakdown === "object") ? t.breakdown : {};
      var seen = false;
      for (var sk in src) {
        if (!Object.prototype.hasOwnProperty.call(src, sk)) continue;
        seen = true;
        if (num(src[sk]) === 0) continue;
        exps.push({ id: uid(), cat: ensureCat(sk, sk), label: "", amount: num(src[sk]), url: "" });
      }
      /* a legacy flat cost lands in "other" so nothing is lost */
      if (!seen && t.cost != null && num(t.cost) !== 0) {
        exps.push({ id: uid(), cat: ensureCat("other", "other"), label: "", amount: num(t.cost), url: "" });
      }
    }

    /* countries: an array of codes, or an older free-text "place" */
    var codes = [];
    var rawC = t.countries;
    if (Object.prototype.toString.call(rawC) === "[object Array]") {
      for (var q = 0; q < rawC.length; q++) {
        var cc = String(rawC[q] || "").toUpperCase();
        if (COUNTRY_NAME[cc] && codes.indexOf(cc) < 0) codes.push(cc);
      }
    }
    var notes = String(t.notes == null ? "" : t.notes);
    if (!codes.length && t.place) {
      var guess = matchCountry(String(t.place));
      if (guess) codes.push(guess);
      else notes = (String(t.place) + (notes ? "\n" + notes : ""));   /* keep the text rather than lose it */
    }

    /* "Planned" retired: it never meant money was committed, so it lands on Idea */
    var status = STATUSES.indexOf(t.status) >= 0 ? t.status : (t.status === "Planned" ? "Idea" : STATUSES[0]);

    s.trips.push({
      id: t.id ? String(t.id) : uid(),
      name: String(t.name == null ? "" : t.name),
      countries: codes,
      start: /^\d{4}-\d{2}-\d{2}$/.test(t.start || "") ? t.start : "",
      end: /^\d{4}-\d{2}-\d{2}$/.test(t.end || "") ? t.end : "",
      status: status,
      notes: notes,
      expenses: exps
    });
  }
  return s;
}

var loadedRaw = null;

function load() {
  var raw = null;
  try {
    raw = window.localStorage.getItem(STORE_KEY);
  } catch (e) {
    ui.storageOK = false;
  }
  loadedRaw = raw;
  if (raw) {
    try { state = migrate(JSON.parse(raw)); }
    catch (e2) { state = defaultState(); }
  } else {
    state = defaultState();
  }
}

function save() {
  try {
    window.localStorage.setItem(STORE_KEY, JSON.stringify(state));
    ui.storageOK = true;
  } catch (e) {
    ui.storageOK = false;
  }
  fileSync();  /* optional File System Access mirror */
}

/* =========================================================================
   Derived values
   ========================================================================= */

function tripTotal(t) {
  var s = 0, e = t.expenses || [];
  for (var i = 0; i < e.length; i++) s += num(e[i].amount);
  return s;
}

function expensesInCat(t, k) {
  var out = [], e = t.expenses || [];
  for (var i = 0; i < e.length; i++) if (e[i].cat === k) out.push(e[i]);
  return out;
}

function catTotal(t, k) {
  var s = 0, e = t.expenses || [];
  for (var i = 0; i < e.length; i++) if (e[i].cat === k) s += num(e[i].amount);
  return s;
}

/* Categories this trip actually uses, in the global category order. */
function catsUsed(t) {
  var out = [], list = cats();
  for (var i = 0; i < list.length; i++) {
    if (expensesInCat(t, list[i].k).length) out.push(list[i]);
  }
  return out;
}

function tripYear(t) {
  var d = parseISO(t.start);
  return d ? d.getFullYear() : PLANNING_YEAR;
}

function tripsForYear(y) {
  var out = [];
  for (var i = 0; i < state.trips.length; i++) {
    if (tripYear(state.trips[i]) === y) out.push(state.trips[i]);
  }
  return out;
}

function budgetFor(y) { return num(state.budgetByYear[String(y)]); }

/* --- the budget window -------------------------------------------------
   A budget entered in August is a budget for August-to-December, not for a
   year that is already two thirds gone. Every figure below is scoped to the
   window [start .. 31 Dec], which is the whole year unless the user says
   otherwise. */

function budgetStart(y) {
  var d = parseISO(state.budgetStartByYear[String(y)]);
  return (d && d.getFullYear() === y) ? d : new Date(y, 0, 1);
}

function budgetWindow(y) {
  var from = budgetStart(y);
  var afterEnd = new Date(y + 1, 0, 1);          /* exclusive end */
  var yearStart = new Date(y, 0, 1);
  var dayMs = 86400000;
  var windowDays = Math.round((afterEnd - from) / dayMs);
  var yearDays = Math.round((afterEnd - yearStart) / dayMs);
  return {
    from: from,
    fromISO: iso(from),
    afterEnd: afterEnd,
    partial: from.getMonth() !== 0 || from.getDate() !== 1,
    days: windowDays,
    months: 12 * windowDays / yearDays
  };
}

function windowLabel(y) {
  var w = budgetWindow(y);
  if (!w.partial) return "1 Jan \u2013 31 Dec " + y;
  return w.from.getDate() + " " + MON_ABBR[w.from.getMonth()] + " \u2013 31 Dec " + y;
}

/* Fraction of the *window* gone, live from the real clock. */
function windowElapsed(y) {
  var w = budgetWindow(y);
  var now = Date.now();
  if (now <= w.from.getTime()) return 0;
  if (now >= w.afterEnd.getTime()) return 1;
  return (now - w.from.getTime()) / (w.afterEnd.getTime() - w.from.getTime());
}

/* A dated trip starting before the window predates the budget, so it cannot
   consume it. Undated trips are still to come, so they count. */
function inWindow(t, y) {
  var w = budgetWindow(y);
  if (!w.partial || !t.start) return true;
  return t.start >= w.fromISO;
}

function yearStats(y) {
  var all = tripsForYear(y);
  var trips = [], spent = 0, upcoming = 0;
  var outsideAmount = 0, outsideCount = 0;

  for (var i = 0; i < all.length; i++) {
    var tot = tripTotal(all[i]);
    if (!inWindow(all[i], y)) {
      if (tot > 0) { outsideAmount += tot; outsideCount++; }
      continue;
    }
    trips.push(all[i]);
    if (all[i].status === "Done") spent += tot; else upcoming += tot;
  }

  var budget = budgetFor(y);
  var allocatedAll = spent + upcoming;
  return {
    year: y,
    budget: budget,
    trips: trips,
    spent: spent,
    upcoming: upcoming,          /* allocated, status !== Done */
    allocatedAll: allocatedAll,
    free: budget - allocatedAll, /* unallocated; negative when over */
    left: budget - spent,        /* left to spend */
    over: Math.max(0, allocatedAll - budget),
    outsideAmount: outsideAmount,
    outsideCount: outsideCount
  };
}

function pacing(y) {
  var st = yearStats(y);
  var w = budgetWindow(y);
  var elapsed = windowElapsed(y);
  var now = Date.now();
  var phase = now < w.from.getTime() ? "future"
            : (now >= w.afterEnd.getTime() ? "past" : "current");
  var committed = st.budget > 0 ? st.allocatedAll / st.budget : 0;
  var monthsLeft = w.months * (1 - elapsed);
  var period = w.partial ? "the window" : "the year";

  var verdict, tone, line;
  if (st.budget <= 0) {
    verdict = "no budget"; tone = "";
    line = "Set a budget for " + windowLabel(y) + " to see how it is pacing.";
  } else if (committed > 1) {
    verdict = "over"; tone = "over";
    line = "Committed " + pct(committed) + " of the budget \u2014 " + money(st.over) + " past the line.";
  } else if (phase === "past") {
    verdict = "wrapped"; tone = "";
    line = y + " is wrapped: " + pct(committed) + " of the budget committed.";
  } else if (phase === "future") {
    verdict = "not started"; tone = "blue";
    line = (w.partial ? "This budget starts " + fmtDay(w.from) : y + " hasn\u2019t started") +
           " \u2014 " + money(st.free) + " free to plan across " + period + ".";
  } else if (committed < elapsed - 0.1) {
    verdict = "behind"; tone = "blue";
    line = "Under-committed for the date: " + pct(committed) + " planned vs " + pct(elapsed) + " of " + period + " gone.";
  } else if (committed > elapsed + 0.1) {
    verdict = "ahead"; tone = "amber";
    line = "Running ahead: " + pct(committed) + " committed against " + pct(elapsed) + " of " + period + ".";
  } else {
    verdict = "on pace"; tone = "go";
    line = "On pace \u2014 " + pct(committed) + " committed, " + pct(elapsed) + " of " + period + " gone.";
  }

  var perMonth = null;
  if (st.budget > 0 && phase !== "past") {
    perMonth = monthsLeft > 0.25 ? st.free / monthsLeft : st.free;
  }

  return {
    st: st, w: w, elapsed: elapsed, committed: committed, phase: phase,
    verdict: verdict, tone: tone, line: line,
    monthsLeft: monthsLeft, perMonth: perMonth
  };
}

var TONE_COLOR = { go: "var(--go)", amber: "var(--amber)", over: "var(--over)", blue: "#2E6DB4", "": "#9AA8B6" };

/* =========================================================================
   Dashboard
   ========================================================================= */

function allocationBar(st) {
  /* Peel the overspend off the end (upcoming first, then spent) so the bar
     always sums to max(budget, allocated). */
  var over = st.over;
  var overFromUpcoming = Math.min(over, st.upcoming);
  var overFromSpent = over - overFromUpcoming;
  var segs = [
    { v: st.spent - overFromSpent, c: "var(--spent)" },
    { v: st.upcoming - overFromUpcoming, c: "var(--alloc)" },
    { v: Math.max(0, st.free), c: "var(--free)" },
    { v: over, c: "var(--overbar)" }
  ];
  var denom = Math.max(st.budget, st.allocatedAll);
  var html = "";
  if (denom > 0) {
    for (var i = 0; i < segs.length; i++) {
      if (segs[i].v <= 0) continue;
      html += '<i style="width:' + (segs[i].v / denom * 100) + '%;background:' + segs[i].c + '"></i>';
    }
  }
  return '<div class="bar">' + html + "</div>";
}

function nudgeFor(st) {
  var msg, color;
  if (st.budget <= 0) {
    color = "var(--muted)";
    msg = "Set an annual budget above, then add trips — this line will tell you whether you're using the runway or overshooting it.";
  } else if (st.free < 0) {
    color = "var(--over)";
    msg = "Over by " + money(-st.free) + ". Trim a trip, move one to next year, or raise the budget.";
  } else if (st.free > st.budget * 0.4) {
    color = "#2E6DB4";
    msg = money(st.free) + " still unallocated — that's a lot of runway. Plan something rather than let it go unused.";
  } else if (st.free > st.budget * 0.05) {
    color = "var(--go)";
    msg = "Nicely balanced: " + money(st.free) + " free on top of " + money(st.allocatedAll) + " planned.";
  } else {
    color = "var(--amber)";
    msg = "Fully allocated — " + money(st.free) + " left. The year is spoken for; anything new means trading something out.";
  }
  return '<div class="nudge" style="border-left-color:' + color + '">' +
         '<span class="dot" style="background:' + color + '"></span><span>' + esc(msg) + "</span></div>";
}

function monthly(y) {
  var spent = [], planned = [], i;
  for (i = 0; i < 12; i++) { spent.push(0); planned.push(0); }
  var undated = { spent: 0, planned: 0 };

  var trips = tripsForYear(y);
  for (i = 0; i < trips.length; i++) {
    var t = trips[i], tot = tripTotal(t);
    if (tot === 0) continue;
    var d = parseISO(t.start);
    var done = t.status === "Done";
    if (!d) { if (done) undated.spent += tot; else undated.planned += tot; continue; }
    if (done) spent[d.getMonth()] += tot; else planned[d.getMonth()] += tot;
  }

  var max = 0;
  for (i = 0; i < 12; i++) max = Math.max(max, spent[i] + planned[i]);
  return { spent: spent, planned: planned, undated: undated, max: max };
}

/* Stacked bars, one column per month. Values are read by tapping a column
   rather than printed on every bar. Months before the budget window are dimmed:
   their spend is real, but it does not draw on this budget. */
function monthChart(y) {
  var m = monthly(y);
  var st = yearStats(y);      /* legend totals match the rest of the card: window only */
  var budget = budgetFor(y);
  var w = budgetWindow(y);
  var startMonth = w.from.getMonth();
  var H = 104;
  var perMonthEven = budget > 0 && w.months > 0 ? budget / w.months : 0;
  var scaleMax = Math.max(m.max, perMonthEven);

  var bars = "";
  for (var i = 0; i < 12; i++) {
    var sp = m.spent[i], pl = m.planned[i], tot = sp + pl;
    var outside = w.partial && i < startMonth;
    var segs = "";
    if (scaleMax > 0) {
      /* planned sits on top of spent; the top segment carries the rounded end */
      if (pl > 0) {
        segs += '<i class="top" style="height:' + Math.max(3, pl / scaleMax * H) +
                'px;background:var(--alloc)"></i>';
      }
      if (sp > 0) {
        segs += '<i' + (pl > 0 ? "" : ' class="top"') + ' style="height:' + Math.max(3, sp / scaleMax * H) +
                'px;background:var(--spent)"></i>';
      }
    }
    bars += '<button class="mcol' + (ui.paceMonth === i ? " is-sel" : "") + (outside ? " out" : "") +
            '" data-act="pace-month" data-v="' + i + '" aria-label="' + MONTHS[i] + " " + money(tot) +
            (outside ? ", before the budget window" : "") + '">' + segs + "</button>";
  }

  var labels = "";
  for (var L = 0; L < 12; L++) {
    labels += '<span' + (w.partial && L < startMonth ? ' class="out"' : "") + ">" + MON_SHORT[L] + "</span>";
  }

  /* the even-pace line only spans the window it belongs to */
  var evenLine = "";
  if (perMonthEven > 0 && scaleMax > 0) {
    var atPx = perMonthEven / scaleMax * H;
    var leftPct = w.partial ? (startMonth / 12 * 100) : 0;
    evenLine = '<span class="mpace" style="bottom:' + atPx + 'px;left:' + leftPct + '%"></span>';
  }
  var divider = w.partial
    ? '<span class="mdiv" style="left:' + (startMonth / 12 * 100) + '%"></span>' : "";

  var read;
  if (ui.paceMonth != null) {
    var i2 = ui.paceMonth;
    read = "<b>" + MONTHS[i2] + "</b> \u00b7 " + money(m.spent[i2] + m.planned[i2]) +
           " (" + money(m.spent[i2]) + " spent, " + money(m.planned[i2]) + " planned)" +
           (w.partial && i2 < startMonth ? " \u00b7 before this budget" : "");
  } else if (m.max === 0) {
    read = "No dated trips in " + y + " yet.";
  } else {
    read = "Tap a month for its figures." +
           (perMonthEven > 0 ? " The dashed line is an even " + money(perMonthEven) + " a month across " +
             (w.partial ? "the window" : "the year") + "." : "") +
           (w.partial ? " Faded months are before it and are not in the totals." : "");
  }

  var undatedNote = "";
  if (m.undated.spent + m.undated.planned > 0) {
    undatedNote = '<p class="hint" style="margin:6px 0 0">' + money(m.undated.spent + m.undated.planned) +
      " sits on trips with no start date, so it isn\u2019t in any column.</p>";
  }

  return '<div class="mwrap">' +
    '<div class="card-head" style="margin:0 0 2px"><span class="label">Month by month</span></div>' +
    '<div class="legend" style="margin-bottom:4px">' +
      '<span><b style="background:var(--spent)"></b>Spent <em>' + money(st.spent) + "</em></span>" +
      '<span><b style="background:var(--alloc)"></b>Planned <em>' + money(st.upcoming) + "</em></span>" +
    "</div>" +
    '<div class="mchart">' + evenLine + divider + bars + "</div>" +
    '<div class="mlabels">' + labels + "</div>" +
    '<p class="hint mread">' + read + "</p>" + undatedNote +
  "</div>";
}

function sum(arr) {
  var s2 = 0;
  for (var i = 0; i < arr.length; i++) s2 += arr[i];
  return s2;
}

function pacePanel(y) {
  var p = pacing(y);
  var color = TONE_COLOR[p.tone];
  var fill = clamp(p.committed, 0, 1) * 100;

  /* the strip spans the budget window, so the today marker lines up with it */
  var months = "";
  for (var i = p.w.from.getMonth(); i < 12; i++) months += "<span>" + MON_SHORT[i] + "</span>";

  var marker = p.phase === "current"
    ? '<span class="pace-now" style="left:' + (p.elapsed * 100) + '%" title="today"></span>' : "";

  var perMonth = p.perMonth == null ? "\u2014"
    : (p.st.free < 0 ? money(0) : money(p.perMonth));

  return '<div class="card">' +
    '<div class="card-head"><span class="label">Pacing ' + (p.w.partial ? "the window" : "the year") + "</span>" +
      '<span class="pill ' + p.tone + '">' + esc(p.verdict) + "</span></div>" +
    '<div class="pace-wrap">' +
      '<div class="pace-track">' +
        '<span class="pace-fill" style="width:' + fill + '%;background:' + color + '"></span>' + marker +
      "</div>" +
      '<div class="months">' + months + "</div>" +
    "</div>" +
    '<div class="verdict"><span class="hint">' + esc(p.line) + "</span></div>" +
    '<div class="stats">' +
      '<div><span class="label">Committed</span><div class="v">' + (p.st.budget > 0 ? pct(p.committed) : "\u2014") + "</div></div>" +
      '<div><span class="label">' + (p.w.partial ? "Window gone" : "Year gone") + '</span><div class="v">' + pct(p.elapsed) + "</div></div>" +
      '<div><span class="label">Free / month</span><div class="v">' + perMonth + "</div></div>" +
    "</div>" +
    monthChart(y) +
  "</div>";

}

function renderDash() {
  var y = ui.year;
  var st = yearStats(y);
  var sym = CURRENCIES[state.currency] || CURRENCIES[DEFAULT_CURRENCY];
  var budgetVal = state.budgetByYear[String(y)] == null ? "" : String(state.budgetByYear[String(y)]);

  var h = "";

  if (!ui.storageOK) {
    h += '<div class="card warn"><span class="label">Heads up</span>' +
         '<p class="hint" style="margin:6px 0 0">This browser is blocking local storage, so changes won\'t survive a reload. ' +
         "Use Backup below to keep a copy of your data.</p></div>";
  }

  /* budget + year switcher + the window it covers */
  var win = budgetWindow(y);
  var winRow;
  if (ui.budgetDateOpen) {
    winRow = '<div class="bwin">' +
      '<span class="label">Covers from</span>' +
      '<input id="budget-from" type="date" value="' + esc(win.fromISO) + '" ' +
        'min="' + y + '-01-01" max="' + y + '-12-31">' +
      '<button class="btn small" data-act="budget-date">Done</button></div>' +
      '<p class="hint" style="margin:6px 0 0">Now covering <b>' + esc(windowLabel(y)) + '</b>. ' +
      "Trips starting earlier are left out of the figures below.</p>";
  } else {
    winRow = '<div class="bwin"><span class="hint">Covers <b>' + esc(windowLabel(y)) + "</b></span>" +
      '<button class="btn small" data-act="budget-date">Change</button></div>';
  }

  h += '<div class="card">' +
    '<div class="card-head"><span class="label">Travel budget</span>' +
      '<span class="yearsw">' +
        '<button class="stepper" data-act="year" data-v="-1" aria-label="Previous year">‹</button>' +
        '<span class="y num">' + y + "</span>" +
        '<button class="stepper" data-act="year" data-v="1" aria-label="Next year">›</button>' +
      "</span></div>" +
    '<div class="budget-in"><span class="cur">' + sym + "</span>" +
      '<input id="budget" class="num-in" type="text" inputmode="decimal" placeholder="0" ' +
        'value="' + esc(budgetVal) + '" aria-label="Travel budget for ' + esc(windowLabel(y)) + '"></div>' +
    winRow +
  "</div>";

  /* hero */
  h += '<div class="card hero">' +
    '<span class="label">Unallocated · free to plan</span>' +
    '<div class="big' + (st.free < 0 ? " is-over" : "") + '">' + money(st.free) + "</div>" +
    '<span class="hint">' + money(st.budget) + " for " + esc(windowLabel(y)) + " · " +
      money(st.allocatedAll) + " committed across " +
      st.trips.length + (st.trips.length === 1 ? " trip" : " trips") + "</span>" +
    allocationBar(st) +
    '<div class="legend">' +
      '<span><b style="background:var(--spent)"></b>Spent <em>' + money(st.spent) + "</em></span>" +
      '<span><b style="background:var(--alloc)"></b>Allocated <em>' + money(st.upcoming) + "</em></span>" +
      '<span><b style="background:var(--free)"></b>Free <em>' + money(Math.max(0, st.free)) + "</em></span>" +
      (st.over > 0 ? '<span><b style="background:var(--overbar)"></b>Over <em>' + money(st.over) + "</em></span>" : "") +
    "</div></div>";

  /* tiles */
  h += '<div class="tiles">' +
    '<div class="tile"><span class="label">Allocated<br>(upcoming)</span><div class="v">' + money(st.upcoming) + "</div></div>" +
    '<div class="tile"><span class="label">Unallocated<br>(free)</span><div class="v' + (st.free < 0 ? " is-over" : "") + '">' + money(st.free) + "</div></div>" +
    '<div class="tile"><span class="label">Left<br>to spend</span><div class="v' + (st.left < 0 ? " is-over" : "") + '">' + money(st.left) + "</div></div>" +
  "</div>";

  if (st.outsideCount > 0) {
    h += '<p class="hint" style="margin:-4px 2px 12px">' + money(st.outsideAmount) + " on " + st.outsideCount +
      (st.outsideCount === 1 ? " trip" : " trips") + " starting before " + esc(fmtDay(win.from)) +
      " sits outside this budget.</p>";
  }

  h += nudgeFor(st);
  h += pacePanel(y);

  /* data */
  h += '<div class="card">' +
    '<div class="card-head"><span class="label">Your data</span></div>' +
    '<p class="hint" style="margin:0 0 10px">Everything lives on this device. Back up to a JSON file you keep in Files or iCloud — ' +
      "that file is your durable copy.</p>" +
    '<div class="row" style="flex-wrap:wrap">' +
      '<button class="btn grow" data-act="export">Backup</button>' +
      '<button class="btn grow" data-act="import">Restore</button>' +
      '<button class="btn danger" data-act="reset">Reset</button>' +
    "</div>" +
    (hasFSA()
      ? '<div class="row" style="margin-top:8px">' +
          '<button class="btn grow" data-act="link-file">' + (fsState.name ? "Re-link data file" : "Link data file") + "</button>" +
          '<button class="btn grow" data-act="open-file">Open data file</button>' +
        "</div>" +
        '<p class="hint" id="fs-status" style="margin:8px 0 0">' +
          (fsState.name ? "Auto-saving to " + esc(fsState.name) : "Optional: bind to a real .json file on this computer and auto-save to it.") +
        "</p>"
      : "") +
  "</div>";

  el("view-dash").innerHTML = h;
}

/* =========================================================================
   Calendar
   ========================================================================= */

function holsOn(dISO, country) {
  var all = HOL_BY_DAY[dISO] || [];
  if (!country) return all;
  var out = [];
  for (var i = 0; i < all.length; i++) if (all[i].c === country) out.push(all[i]);
  return out;
}

function isWeekend(dt) { return dowMon(dt) >= 5; }

/* A day off = weekend, or any holiday in that country's calendar
   (Swedish observances like Julafton are treated as days off, which is how
   they work in practice). */
function isOff(dt, country) {
  if (isWeekend(dt)) return true;
  return holsOn(iso(dt), country).length > 0;
}

function offForLens(dt, lens) {
  if (lens === "both") return isOff(dt, "ES") && isOff(dt, "SE");
  return isOff(dt, lens);
}

function tripsCovering(dISO) {
  var out = [];
  for (var i = 0; i < state.trips.length; i++) {
    var t = state.trips[i];
    if (!t.start && !t.end) continue;
    var a = t.start || t.end, b = t.end || t.start;
    if (b < a) { var tmp = a; a = b; b = tmp; }
    if (dISO >= a && dISO <= b) out.push(t);
  }
  return out;
}

function holNames(fromISO, toISO, lens) {
  var names = [], seen = {};
  var d = parseISO(fromISO), stop = parseISO(toISO);
  while (d && stop && iso(d) <= iso(stop)) {
    var hs = HOL_BY_DAY[iso(d)] || [];
    for (var i = 0; i < hs.length; i++) {
      if (lens !== "both" && hs[i].c !== lens) continue;
      var key = hs[i].n;
      if (!seen[key]) { seen[key] = 1; names.push(hs[i].n); }
    }
    d = addDays(d, 1);
  }
  return names;
}

/* Long-weekend windows for the given year and lens. */
function windows(year, lens) {
  var days = [];              /* [{dt, iso, off}] for the whole year */
  var d = new Date(year, 0, 1);
  while (d.getFullYear() === year) {
    days.push({ dt: d, iso: iso(d), off: offForLens(d, lens) });
    d = addDays(d, 1);
  }

  var out = [], i, j;

  /* natural runs of >= 3 days off */
  i = 0;
  while (i < days.length) {
    if (!days[i].off) { i++; continue; }
    j = i;
    while (j + 1 < days.length && days[j + 1].off) j++;
    var len = j - i + 1;
    if (len >= 3) {
      var why = holNames(days[i].iso, days[j].iso, lens);
      out.push({
        kind: lens === "both" ? "shared" : "run",
        start: days[i].iso, end: days[j].iso, len: len,
        why: why.length ? why.join(" · ") : "Weekend run"
      });
    }
    i = j + 1;
  }

  /* single-day bridges (puentes) — only meaningful for one country */
  if (lens !== "both") {
    for (i = 1; i < days.length - 1; i++) {
      if (days[i].off) continue;
      var before = 0, after = 0;
      for (j = i - 1; j >= 0 && days[j].off; j--) before++;
      for (j = i + 1; j < days.length && days[j].off; j++) after++;
      if (before < 1 || after < 1) continue;
      var total = before + 1 + after;
      if (total < 4) continue;
      var s = days[i - before].iso, e = days[i + after].iso;
      var names = holNames(s, e, lens);
      out.push({
        kind: "bridge", start: s, end: e, len: total, take: days[i].iso,
        why: "Take " + fmtDay(days[i].dt) + " off" + (names.length ? " · " + names.join(" · ") : "")
      });
    }
  }

  out.sort(function (a, b) {
    if (a.start === b.start) return b.len - a.len;
    return a.start < b.start ? -1 : 1;
  });
  return out;
}

function weekStartOf(dt) { return addDays(dt, -dowMon(dt)); }

function dayMarks(dISO, lens) {
  return {
    es: (lens === "both" || lens === "ES") && holsOn(dISO, "ES").length > 0,
    se: (lens === "both" || lens === "SE") && holsOn(dISO, "SE").length > 0,
    trip: tripsCovering(dISO).length > 0
  };
}

/* Year at a glance: 12 rows of days, colour-coded. Weekends stay tinted so the
   week rhythm is still readable without day-of-week columns. */
function yearGrid(y, lens) {
  var h = '<div class="ygrid">';
  h += '<span class="ycorner"></span>';
  for (var d = 1; d <= 31; d++) {
    h += '<span class="yhead">' + (d % 5 === 0 || d === 1 ? d : "") + "</span>";
  }
  for (var m = 0; m < 12; m++) {
    h += '<button class="ymon" data-act="calzoom-m" data-v="' + y + "-" + pad2(m + 1) + '-01">' + MON_ABBR[m] + "</button>";
    for (var day = 1; day <= 31; day++) {
      var dt = new Date(y, m, day);
      if (dt.getMonth() !== m) { h += '<span class="ycell out"></span>'; continue; }
      var di = iso(dt);
      var mk = dayMarks(di, lens);
      var cls = "ycell";
      if (offForLens(dt, lens)) cls += " off";
      if (di === todayISO()) cls += " today";
      if (di === ui.selDay) cls += " sel";
      var style = "";
      if (mk.es && mk.se) style = 'background:linear-gradient(135deg,var(--es) 50%,var(--se) 50%)';
      else if (mk.es) style = "background:var(--es)";
      else if (mk.se) style = "background:var(--se)";
      if (mk.trip) cls += " tr";
      h += '<button class="' + cls + '" style="' + style + '" data-act="calzoom" data-v="' + di +
           '" aria-label="' + di + '"></button>';
    }
  }
  h += "</div>";
  h += '<div class="legend" style="margin-top:9px">' +
    '<span><b style="background:var(--es)"></b>Spain</span>' +
    '<span><b style="background:var(--se)"></b>Sweden</span>' +
    '<span><b style="background:var(--trip)"></b>Your trips</span>' +
    '<span><b style="background:var(--paper);border:1px solid var(--line)"></b>Weekend / off</span>' +
  "</div>";
  return h;
}

function monthGrid(y, m, lens) {
  var today = todayISO();
  var first = new Date(y, m, 1);
  var gridStart = addDays(first, -dowMon(first));

  var h = '<div class="dow">';
  for (var i = 0; i < 7; i++) h += "<span>" + DOW[i].charAt(0) + "</span>";
  h += '</div><div class="grid">';

  for (var c = 0; c < 42; c++) {
    var dt = addDays(gridStart, c);
    var di = iso(dt);
    var cls = "day";
    if (dt.getMonth() !== m) cls += " out";
    if (offForLens(dt, lens)) cls += " off";
    if (di === today) cls += " today";
    if (di === ui.selDay) cls += " sel";

    var mk = dayMarks(di, lens);
    var dots = "";
    if (mk.es) dots += '<i class="d-es"></i>';
    if (mk.se) dots += '<i class="d-se"></i>';
    if (mk.trip) dots += '<i class="d-tr"></i>';

    h += '<button class="' + cls + '" data-act="day" data-v="' + di + '">' + dt.getDate() +
         (dots ? '<span class="dots">' + dots + "</span>" : "") + "</button>";
  }
  return h + "</div>";
}

function weekList(startISO, lens) {
  var start = parseISO(startISO) || weekStartOf(new Date());
  var h = '<div class="wlist">';
  for (var i = 0; i < 7; i++) {
    var dt = addDays(start, i);
    var di = iso(dt);
    var hs = HOL_BY_DAY[di] || [];
    var tps = tripsCovering(di);

    var body = "";
    for (var k = 0; k < hs.length; k++) {
      if (lens !== "both" && hs[k].c !== lens) continue;
      body += '<div class="ev"><i class="' + (hs[k].c === "ES" ? "d-es" : "d-se") + '"></i><span>' +
        esc(hs[k].n) + "<br><small>" + (hs[k].c === "ES" ? "Spain" : "Sweden") + " \u00b7 " + esc(hs[k].k) + "</small></span></div>";
    }
    for (var t = 0; t < tps.length; t++) {
      body += '<div class="ev"><i class="d-tr"></i><span>' + esc(tps[t].name || "Untitled trip") +
        "<br><small>" + esc(fmtRange(tps[t].start, tps[t].end)) + " \u00b7 " + esc(tps[t].status) + "</small></span></div>";
    }
    if (!body) body = '<span class="wquiet">' + (offForLens(dt, lens) ? "Off \u00b7 nothing planned" : "Nothing") + "</span>";

    var cls = "wday";
    if (offForLens(dt, lens)) cls += " off";
    if (di === todayISO()) cls += " today";

    h += '<button class="' + cls + '" data-act="day" data-v="' + di + '">' +
      '<span class="wdate"><b>' + dt.getDate() + "</b><small>" + DOW[dowMon(dt)] + "</small></span>" +
      '<span class="wbody">' + body + "</span></button>";
  }
  return h + "</div>";
}

function calTitle(y, m, view) {
  if (view === "year") return String(y);
  if (view === "month") return MONTHS[m] + " " + y;
  var a = parseISO(ui.weekStart) || new Date(y, m, 1);
  var b = addDays(a, 6);
  var am = MONTHS[a.getMonth()].slice(0, 3), bm = MONTHS[b.getMonth()].slice(0, 3);
  return a.getDate() + (am === bm ? "" : " " + am) + " \u2013 " + b.getDate() + " " + bm + " " + b.getFullYear();
}

function renderCal() {
  var y = ui.calYear, m = ui.calMonth, lens = ui.lens, view = ui.calView;

  var h = '<div class="card">' +
    '<div class="cal-head">' +
      '<button class="stepper" data-act="calnav" data-v="-1" aria-label="Previous">\u2039</button>' +
      '<span class="cal-title">' + esc(calTitle(y, m, view)) + "</span>" +
      '<button class="stepper" data-act="calnav" data-v="1" aria-label="Next">\u203a</button>' +
    "</div>" +
    '<div class="seg" style="margin-bottom:8px">' +
      '<button data-act="calview" data-v="year"' + (view === "year" ? ' class="is-on"' : "") + ">Year</button>" +
      '<button data-act="calview" data-v="month"' + (view === "month" ? ' class="is-on"' : "") + ">Month</button>" +
      '<button data-act="calview" data-v="week"' + (view === "week" ? ' class="is-on"' : "") + ">Week</button>" +
    "</div>" +
    '<div class="seg" style="margin-bottom:11px">' +
      '<button data-act="lens" data-v="both"' + (lens === "both" ? ' class="is-on"' : "") + ">Both</button>" +
      '<button data-act="lens" data-v="ES"' + (lens === "ES" ? ' class="is-on"' : "") + ">Spain</button>" +
      '<button data-act="lens" data-v="SE"' + (lens === "SE" ? ' class="is-on"' : "") + ">Sweden</button>" +
    "</div>";

  if (view === "year") h += yearGrid(y, lens);
  else if (view === "month") h += monthGrid(y, m, lens);
  else h += weekList(ui.weekStart, lens);

  /* selected day detail (year view zooms instead of expanding inline) */
  if (ui.selDay && view === "month") {
    var sd = parseISO(ui.selDay);
    var hs2 = HOL_BY_DAY[ui.selDay] || [];
    var tps2 = tripsCovering(ui.selDay);
    var body2 = "";
    for (var k2 = 0; k2 < hs2.length; k2++) {
      if (lens !== "both" && hs2[k2].c !== lens) continue;
      body2 += '<div class="ev"><i class="' + (hs2[k2].c === "ES" ? "d-es" : "d-se") + '"></i><span>' +
        esc(hs2[k2].n) + "<br><small>" + (hs2[k2].c === "ES" ? "Spain" : "Sweden") + " \u00b7 " + esc(hs2[k2].k) + "</small></span></div>";
    }
    for (var t2 = 0; t2 < tps2.length; t2++) {
      body2 += '<div class="ev"><i class="d-tr"></i><span>' + esc(tps2[t2].name || "Untitled trip") +
        "<br><small>" + esc(fmtRange(tps2[t2].start, tps2[t2].end)) + " \u00b7 " + esc(tps2[t2].status) + "</small></span></div>";
    }
    if (!body2) body2 = '<p class="empty">Nothing on this day.</p>';
    h += '<div class="daycard"><h4>' + esc(fmtDay(sd)) + " " + sd.getFullYear() + "</h4>" + body2 + "</div>";
  }

  h += "</div>";

  /* windows */
  var wins = windows(y, lens);
  var title = lens === "both" ? "Days off in both countries" : "Long weekends \u00b7 " + (lens === "ES" ? "Spain" : "Sweden");
  h += '<div class="card"><div class="card-head"><span class="label">' + esc(title) + " \u00b7 " + y + "</span></div>";
  if (lens === "both") {
    h += '<p class="hint" style="margin:0 0 10px">Stretches of three days or more when both calendars are off \u2014 the easy ' +
         "windows for a visit in either direction.</p>";
  } else {
    h += '<p class="hint" style="margin:0 0 10px">Runs of three days or more off, plus single days worth taking as a bridge.</p>';
  }
  if (!wins.length) {
    h += '<p class="empty">No windows found for ' + y + " under this lens.</p>";
  } else {
    for (var w = 0; w < wins.length; w++) {
      var win = wins[w];
      h += '<button class="win' + (win.kind === "bridge" ? " bridge" : "") + '" data-act="jump" data-v="' + win.start + '">' +
        '<span class="t"><span class="dates">' + esc(fmtRange(win.start, win.end)) + "</span>" +
        '<span class="len">' + win.len + " days" + (win.kind === "bridge" ? " \u00b7 bridge" : "") + "</span></span>" +
        '<span class="why">' + esc(win.why) + "</span></button>";
    }
  }
  h += "</div>";

  el("view-cal").innerHTML = h;
}

/* =========================================================================
   Trips
   ========================================================================= */

function blankTrip() {
  return {
    id: uid(), name: "", countries: [], start: "", end: "",
    status: STATUSES[0], notes: "", expenses: [blankExpense()]
  };
}

function tripById(id) {
  for (var i = 0; i < state.trips.length; i++) if (state.trips[i].id === id) return state.trips[i];
  return null;
}

function optList(arr, sel) {
  var h = "";
  for (var i = 0; i < arr.length; i++) {
    h += '<option value="' + esc(arr[i]) + '"' + (arr[i] === sel ? " selected" : "") + ">" + esc(arr[i]) + "</option>";
  }
  return h;
}

/* --- country multiselect ------------------------------------------------ */

function countryPicker(selected) {
  var q = (ui.countryQuery || "").trim().toLowerCase();

  var chips = "";
  for (var i = 0; i < selected.length; i++) {
    chips += '<button class="chip" data-act="country-off" data-v="' + esc(selected[i]) + '">' +
      esc(countryLabel(selected[i])) + '<span class="x">\u00d7</span></button>';
  }
  if (!chips) chips = '<span class="hint">No countries yet.</span>';

  var body = "";
  if (ui.countryOpen) {
    var rows = "", shown = 0;
    for (var c = 0; c < COUNTRIES.length; c++) {
      var code = COUNTRIES[c].slice(0, 2), name = COUNTRIES[c].slice(3);
      if (q && name.toLowerCase().indexOf(q) < 0 && code.toLowerCase().indexOf(q) < 0) continue;
      if (shown >= 60) break;
      shown++;
      var on = selected.indexOf(code) >= 0;
      rows += '<button class="crow' + (on ? " on" : "") + '" data-act="country-on" data-v="' + code + '">' +
        '<span class="cflag">' + flagOf(code) + "</span><span class=\"cname\">" + esc(name) + "</span>" +
        '<span class="ctick">' + (on ? "\u2713" : "") + "</span></button>";
    }
    if (!rows) rows = '<p class="empty">No country matches \u201c' + esc(ui.countryQuery) + '\u201d.</p>';
    body = '<div class="cpick">' +
      '<input id="f-country-q" type="text" placeholder="Search countries" autocomplete="off" value="' +
        esc(ui.countryQuery || "") + '">' +
      '<div class="clist">' + rows + "</div></div>";
  }

  return '<div class="field"><span class="label">Countries</span>' +
    '<div class="chips">' + chips + "</div>" +
    '<button class="btn small" style="margin-top:7px" data-act="country-toggle">' +
      (ui.countryOpen ? "Done" : "＋ Add country") + "</button>" +
    body + "</div>";
}

/* --- the form ----------------------------------------------------------- */

function tripForm(t) {
  var h = '<div class="card" id="trip-form">' +
    '<div class="card-head"><span class="label">' + (tripById(t.id) ? "Edit trip" : "New trip") + "</span></div>";

  h += '<div class="field"><span class="label">Name</span>' +
       '<input id="f-name" type="text" placeholder="Weekend somewhere" value="' + esc(t.name) + '"></div>';

  h += countryPicker(t.countries || []);

  h += '<div class="two">' +
    '<div class="field"><span class="label">Start</span><input id="f-start" type="date" value="' + esc(t.start) + '"></div>' +
    '<div class="field"><span class="label">End</span><input id="f-end" type="date" value="' + esc(t.end) + '"></div>' +
  "</div>";

  h += '<div class="field"><span class="label">Status</span><select id="f-status">' + optList(STATUSES, t.status) + "</select></div>";

  h += '<div class="field"><span class="label">Expenses</span>';
  var list = cats();
  var exps = t.expenses || [];
  if (!exps.length) {
    h += '<p class="empty" style="margin:0 0 8px">Nothing yet \u2014 add a flight, a hotel, anything you want to track.</p>';
  }
  for (var i = 0; i < exps.length; i++) {
    var e = exps[i];
    var pre = "f-exp-" + esc(e.id);
    var cat = catByKey(e.cat) || list[0];

    var opts = "";
    for (var ci = 0; ci < list.length; ci++) {
      opts += '<option value="' + esc(list[ci].k) + '"' + (list[ci].k === e.cat ? " selected" : "") +
              ">" + esc(list[ci].label) + "</option>";
    }

    h += '<div class="exp">' +
      '<div class="exp-top">' +
        '<i style="background:' + (cat ? cat.c : "#8A94A0") + '"></i>' +
        '<select id="' + pre + '-cat" class="f-ecat" data-exp="' + esc(e.id) + '">' + opts + "</select>" +
        '<input id="' + pre + '-amt" class="f-amt num-in" data-exp="' + esc(e.id) + '" type="text" ' +
          'inputmode="decimal" placeholder="0" aria-label="Amount" value="' + (num(e.amount) ? esc(String(num(e.amount))) : "") + '">' +
        '<button class="catx" data-act="exp-del" data-v="' + esc(e.id) + '" aria-label="Remove expense">\u00d7</button>' +
      "</div>" +
      '<input id="' + pre + '-label" class="f-elabel" data-exp="' + esc(e.id) + '" type="text" ' +
        'placeholder="What is it? (optional)" value="' + esc(e.label) + '">' +
      '<input id="' + pre + '-url" class="f-eurl" data-exp="' + esc(e.id) + '" type="url" ' +
        'inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" ' +
        'placeholder="Link (optional)" value="' + esc(e.url) + '">' +
    "</div>";
  }
  h += '<button class="btn small" style="margin-top:2px" data-act="exp-add">\uff0b Add expense</button>';

  if (ui.newCatOpen) {
    h += '<div class="newcat">' +
      '<input id="f-newcat" type="text" placeholder="Category name" autocomplete="off" value="' +
        esc(ui.newCatText || "") + '">' +
      '<button class="btn small primary" data-act="cat-add">Add</button>' +
      '<button class="btn small" data-act="cat-cancel">Cancel</button></div>';
  } else {
    h += '<button class="btn small" style="margin-top:8px" data-act="cat-new">＋ New category</button>';
  }

  /* a category nothing spends on can be taken back out — otherwise a typo
     would be permanent */
  var spare = [];
  for (var si = 0; si < list.length; si++) {
    if (list[si].custom && !catInUse(list[si].k)) spare.push(list[si]);
  }
  if (spare.length) {
    h += '<div class="chips" style="margin-top:8px">';
    for (var sj = 0; sj < spare.length; sj++) {
      h += '<button class="chip" data-act="cat-del" data-v="' + esc(spare[sj].k) + '" ' +
        'title="Remove this unused category">' + esc(spare[sj].label) + '<span class="x">\u00d7</span></button>';
    }
    h += '</div><p class="hint" style="margin:5px 0 0">Unused categories \u2014 tap to remove.</p>';
  }
  h += "</div>";

  h += '<div class="field"><span class="label">Notes</span>' +
       '<textarea id="f-notes" placeholder="Anything worth remembering">' + esc(t.notes) + "</textarea></div>";

  h += '<div class="form-total"><span class="label">Trip total</span>' +
       '<span class="v" id="f-total">' + money(tripTotal(t)) + "</span></div>";

  h += '<div class="row" style="margin-top:12px">' +
    '<button class="btn primary grow" data-act="trip-save">Save trip</button>' +
    '<button class="btn" data-act="trip-cancel">Cancel</button>' +
  "</div></div>";
  return h;
}

function catInUse(k) {
  var pools = state.trips.slice();
  if (ui.draft) pools.push(ui.draft);
  for (var i = 0; i < pools.length; i++) {
    if (expensesInCat(pools[i], k).length) return true;
  }
  return false;
}

function formTotal() {
  var inputs = document.querySelectorAll(".f-amt");
  var s = 0;
  for (var i = 0; i < inputs.length; i++) s += num(inputs[i].value);
  return s;
}

/* Reads the DOM back into the working draft. Countries live in the draft
   because they are not form inputs. */
function readForm() {
  var d = ui.draft || blankTrip();
  if (!el("f-name")) return d;

  var out = {
    id: d.id,
    name: el("f-name").value.trim(),
    countries: (d.countries || []).slice(),
    start: el("f-start").value || "",
    end: el("f-end").value || "",
    status: el("f-status").value,
    notes: el("f-notes").value,
    expenses: []
  };

  /* read the rows back in DOM order, falling back to the draft for any row
     that is not currently rendered */
  var rows = (d.expenses || []);
  for (var i = 0; i < rows.length; i++) {
    var e = rows[i];
    var catN = el("f-exp-" + e.id + "-cat");
    var amtN = el("f-exp-" + e.id + "-amt");
    var labN = el("f-exp-" + e.id + "-label");
    var urlN = el("f-exp-" + e.id + "-url");
    out.expenses.push({
      id: e.id,
      cat: catN ? catN.value : e.cat,
      label: labN ? labN.value : e.label,
      amount: amtN ? num(amtN.value) : num(e.amount),
      url: urlN ? String(urlN.value).trim() : e.url
    });
  }
  if (out.start && out.end && out.end < out.start) { var sw = out.start; out.start = out.end; out.end = sw; }
  return out;
}

/* Re-render the trips view without losing anything typed so far. */
function refreshForm(focusId) {
  if (ui.formOpen) ui.draft = readForm();
  renderTrips();
  if (focusId) {
    var n = el(focusId);
    if (n) { n.focus(); if (n.setSelectionRange) { try { n.setSelectionRange(n.value.length, n.value.length); } catch (e) {} } }
  }
}

/* --- cards -------------------------------------------------------------- */

function tripCard(t) {
  var tot = tripTotal(t);
  var open = ui.openTrip === t.id;
  var list = cats();

  var used = catsUsed(t);
